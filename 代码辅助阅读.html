<script id="snapshot" type="application/json">[{"group": "启动与会话", "path": "src/board/runtime/run_camera.py", "name": "run_camera.py", "desc": "等待相机、创建会话并启动worker；接收协作停止请求。", "content": "\"\"\"Foreground service owner. Zero limits explicitly mean continuous operation.\"\"\"\n\nfrom pathlib import Path\nimport argparse, datetime, fcntl, hashlib, json, os, signal, subprocess, sys, time, shutil\nfrom runtime_log import PipeLog\n\n# 会话名包含本次boot，避免板端时钟回退后覆盖旧记录。\nfrom session_retention import maintain_sessions, prepare_session\n\nROOT = Path(__file__).resolve().parent\nRUNTIME = {\n    \"ICRAFT_VERSION\": \"v3.39.0\",\n    \"LD_LIBRARY_PATH\": \"/root/fpga_gaming/m7_20261002_01/runtime_339/usr/lib/aarch64-linux-gnu:/root/fpga_gaming/m7_20261002_01/runtime_339/ModelzooDeps/aarch64/Shared/lib\",\n}\n\n\ndef digest(p):\n    return hashlib.sha256(Path(p).read_bytes()).hexdigest()\n\n\ndef save(p, data):\n    t = p.with_suffix(p.suffix + \".tmp\")\n    t.write_text(json.dumps(data, ensure_ascii=False, indent=2))\n    os.replace(t, p)\n\n\n# 启动前逐项比对清单：运行文件不匹配时不打开推理设备。\ndef verify_payload():\n    manifest = json.loads((ROOT / \"PAYLOAD_SHA256.json\").read_text())\n    for name, expected in manifest.items():\n        if digest(ROOT / name) != expected:\n            raise RuntimeError(\"Payload differs: \" + name)\n    return manifest\n\n\n# 只选择支持YUYV的D435i彩色接口；多台相机时要求人工指定。\ndef select_camera():\n    choices = []\n    for p in sorted(Path(\"/sys/class/video4linux\").glob(\"*\")):\n        if \"RealSense\" not in (p / \"name\").read_text():\n            continue\n        q = subprocess.run(\n            [\"v4l2-ctl\", \"--list-formats-ext\", \"-d\", \"/dev/\" + p.name],\n            capture_output=True,\n            timeout=5,\n        )\n        if q.returncode == 0 and \"'YUYV'\" in q.stdout.decode(errors=\"replace\"):\n            choices.append(\"/dev/\" + p.name)\n    if len(choices) > 1:\n        raise RuntimeError(\"Multiple D435i color interfaces: \" + repr(choices))\n    return choices[0] if choices else None\n\n\ndef trim_sessions():\n    # Startup history is bounded by boot identity; a live device owner is retained.\n    maintain_sessions(ROOT)\n\n\ndef main():\n    a = argparse.ArgumentParser()\n    a.add_argument(\"--camera\", default=\"auto\")\n    a.add_argument(\"--seconds\", type=int, default=0)\n    a.add_argument(\"--frames\", type=int, default=0)\n    a.add_argument(\"--video-frames\", type=int, default=1200)\n    a.add_argument(\"--camera-wait\", type=int, default=180)\n    a.add_argument(\"--qualification-probe\", action=\"store_true\")\n    a.add_argument(\"--gap-test\", action=\"store_true\")\n    a.add_argument(\"--capture-fps\", type=int, choices=[15, 30], default=30)\n    a.add_argument(\"--service-rate\", type=float, default=0)\n    args = a.parse_args()\n    if not (\n        0 \u003c= args.seconds \u003c= 86400\n        and 0 \u003c= args.frames \u003c= 2000000\n        and 0 \u003c= args.video_frames \u003c= 1200\n    ):\n        a.error(\"Zero means continuous; finite bounds86400s/2000000frames; video0..1200\")\n    # 先取得启动互斥锁，避免两个服务入口同时创建检测会话。\n    fd = os.open(str(ROOT / \"launcher.lock\"), os.O_CREAT | os.O_RDWR, 0o600)\n    fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)\n    boot = Path(\"/proc/sys/kernel/random/boot_id\").read_text().strip()\n    stop = False\n    out = None\n\n    def onstop(*_):\n        nonlocal stop\n        stop = True\n\n    signal.signal(signal.SIGTERM, onstop)\n    signal.signal(signal.SIGINT, onstop)\n\n    def phase(value, **kw):\n        save(\n            ROOT / \"APP_STATE.json\",\n            dict(phase=value, boot=boot, updated_monotonic_s=time.monotonic(), **kw),\n        )\n\n    try:\n        phase(\"STARTING\")\n        # 校验、检查旧现场并整理历史会话后，才进入相机等待。\n        payload = verify_payload()\n        if not args.qualification_probe and not json.loads(\n            (ROOT / \"RELEASE_ACCEPTANCE.json\").read_text()\n        ).get(\"accepted\"):\n            raise RuntimeError(\"Release not accepted\")\n        if (ROOT / \"UNKNOWN.json\").exists():\n            raise RuntimeError(\"Prior device session retained; inspect UNKNOWN.json\")\n        trim_sessions()\n        start = time.monotonic()\n        camera = None\n        while not stop:\n            camera = select_camera() if args.camera == \"auto\" else args.camera\n            if camera:\n                break\n            phase(\n                \"WAITING_CAMERA\",\n                reason=\"Waiting for D435i YUYV color interface\",\n                waited_s=time.monotonic() - start,\n            )\n            if time.monotonic() - start >= args.camera_wait:\n                raise RuntimeError(\n                    \"Camera readiness deadline exceeded; reconnect then authenticated Start\"\n                )\n            time.sleep(1)\n        if stop:\n            phase(\"STOPPED\", reason=\"Stopped before opening NPU\")\n            return 0\n        # 会话名包含启动身份，避免板端时间回退时复用旧记录目录。\n        name = (\n            \"camera_\"\n            + datetime.datetime.now().strftime(\"%Y%m%d_%H%M%S_%f\")\n            + \"_b\"\n            + boot.replace(\"-\", \"\")\n        )\n        out = ROOT / \"sessions\" / name\n        prepare_session(out, boot)\n        session = dict(\n            mode=\"camera\",\n            max_forwards=args.frames,\n            seconds=args.seconds,\n            video_frames_max=args.video_frames,\n            capture_fps=args.capture_fps,\n            service_rate_hz=args.service_rate,\n        )\n        if args.gap_test:\n            session[\"gap_after_s\"] = 10\n        save(\n            ROOT / \"contract.json\",\n            dict(\n                boot=boot,\n                runtime_env=RUNTIME,\n                protected_files={},\n                payload_SHA=payload,\n                camera_device=camera,\n                sessions={name: session},\n            ),\n        )\n        save(\n            ROOT / \"ACTIVE_RUN.json\",\n            dict(\n                session=name,\n                boot=boot,\n                model=\"11\",\n                camera_device=camera,\n                seconds=args.seconds,\n                max_forwards=args.frames,\n                continuous=args.seconds == args.frames == 0,\n                capture_fps=args.capture_fps,\n                service_rate_hz=args.service_rate,\n            ),\n        )\n        # worker持有本次检测流程；父进程排空日志并转发正常停止请求。\n        worker = subprocess.Popen(\n            [sys.executable, \"-B\", \"-u\", str(ROOT / \"worker.py\"), name],\n            cwd=str(ROOT),\n            stdout=subprocess.PIPE,\n            stderr=subprocess.PIPE,\n        )\n        logs = [\n            PipeLog(worker.stdout, ROOT / \"worker.stdout\"),\n            PipeLog(worker.stderr, ROOT / \"worker.stderr\"),\n        ]\n        phase(\"ACTIVE\", session=name)\n        while worker.poll() is None:\n            # STOP由worker协作处理，等待推理返回和SDK关闭。\n            if stop:\n                phase(\"STOPPING\", session=name, reason=\"Waiting for inference and SDK close\")\n                if out.is_dir():\n                    (out / \"STOP\").write_text(\"Cooperative service stop\")\n            time.sleep(0.5)\n        for log in logs:\n            log.close()\n        phase(\n            \"STOPPED\" if worker.returncode == 0 else \"FAILED\",\n            session=name,\n            exit_code=worker.returncode,\n        )\n        return worker.returncode\n    except Exception as e:\n        phase(\"FAILED\", reason=str(e))\n        print(str(e), file=sys.stderr, flush=True)\n        return 1\n    finally:\n        os.close(fd)\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n", "sha256": "2e32adf947207eed92a7c3f6ff4f6bb822af1ff798f3279d8cbedf82a1510819", "functions": [{"name": "digest", "line": 17, "end": 18}, {"name": "save", "line": 21, "end": 24}, {"name": "verify_payload", "line": 28, "end": 33}, {"name": "select_camera", "line": 37, "end": 51}, {"name": "trim_sessions", "line": 54, "end": 56}, {"name": "main", "line": 59, "end": 203}, {"name": "onstop", "line": 84, "end": 86}, {"name": "phase", "line": 91, "end": 95}]}, {"group": "启动与会话", "path": "src/board/runtime/stop_app.py", "name": "stop_app.py", "desc": "向运行会话提交正常停止请求。", "content": "\"\"\"向检测会话提交正常停止请求。\"\"\"\nimport subprocess, json\n\nsubprocess.run([\"systemctl\", \"stop\", \"--no-block\", \"model11-detect.service\"], check=True)\nprint(\n    json.dumps(\n        dict(\n            requested=True, message=\"Wait for STOPPED/device_closed; unknown owners remain retained\"\n        )\n    )\n)\n", "sha256": "ebb29a6a710f5930068b47e93945246e3062f49b92a2fcecf0eee0be582f04a4", "functions": []}, {"group": "启动与会话", "path": "src/board/runtime/session_retention.py", "name": "session_retention.py", "desc": "限制历史会话数量，保留运行中的设备所有者。", "content": "\"\"\"Bounded camera history, with boot identity instead of a directory-count gate.\n\nCalled by the single systemd launcher before it opens any camera or SDK.\nCurrent-boot uncertain owners remain a fault. Interrupted older boots are history,\nnot live device owners. The existing kernel device lock must be free throughout GC.\n\"\"\"\n\nfrom contextlib import contextmanager\nfrom pathlib import Path\nimport json\nimport os\nimport re\nimport shutil\nimport stat\nimport time\nimport uuid\n\nDEVICE_LOCK = Path(\"/root/fpga_gaming/ps_session_m53.lock\")\nDEVICE_LOCK_INODE = 943514\nKEEP_HISTORY = 4\n\n\ndef boot_id(value):\n    try:\n        return str(uuid.UUID(str(value)))\n    except (ValueError, TypeError, AttributeError):\n        return None\n\n\ndef read_json(path):\n    if not path.exists():\n        return {}\n    data = json.loads(path.read_text())\n    if not isinstance(data, dict):\n        raise ValueError(\"Expected JSON object: \" + str(path))\n    return data\n\n\ndef atomic_json(path, value):\n    temp = path.with_suffix(path.suffix + \".tmp\")\n    temp.write_text(json.dumps(value, ensure_ascii=False, indent=2))\n    os.replace(temp, path)\n\n\n@contextmanager\ndef device_guard(path=DEVICE_LOCK, expected_inode=DEVICE_LOCK_INODE):\n    # Never create/unlink/replace the real lock and never open a device or MMIO.\n    import fcntl\n\n    fd = os.open(str(path), os.O_RDWR | os.O_NOFOLLOW)\n    try:\n        info = os.fstat(fd)\n        if not stat.S_ISREG(info.st_mode) or info.st_ino != expected_inode:\n            raise RuntimeError(\"Device lock identity differs; inspect before starting\")\n        try:\n            fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)\n        except BlockingIOError:\n            raise RuntimeError(\"Device owner still holds its lock; no history changed\")\n        yield\n    finally:\n        os.close(fd)\n\n\ndef classify(path, current_boot):\n    \"\"\"Only a confirmed SDK close or a different, consistent boot is reclaimable.\"\"\"\n    try:\n        state = read_json(path / \"state.json\")\n        result = read_json(path / \"result.json\")\n        owner = read_json(path / \"owner.json\")\n        raw_boots = [x[\"boot\"] for x in (state, result, owner) if x.get(\"boot\")]\n        match = re.search(r\"_b([0-9a-f]{32})$\", path.name)\n        if match:\n            raw_boots.append(match.group(1))\n        parsed = [boot_id(x) for x in raw_boots]\n        if None in parsed or len(set(parsed)) > 1:\n            raise ValueError(\"Conflicting or invalid boot identity\")\n        previous = parsed[0] if parsed else None\n        if result.get(\"device_closed\") is True:\n            kind = \"SDK_CLOSED\"\n        elif previous and previous != current_boot:\n            kind = \"INTERRUPTED_PREVIOUS_BOOT\"\n        else:\n            kind = \"UNRESOLVED_CURRENT_BOOT\" if previous else \"UNCLASSIFIED_LEGACY\"\n        return dict(\n            name=path.name,\n            kind=kind,\n            boot=previous,\n            frames=result.get(\"frames\", state.get(\"frames\")),\n            last_phase=state.get(\"phase\"),\n            updated_monotonic_s=float(state.get(\"updated_monotonic_s\") or 0),\n            error=str(result.get(\"error\", \"\"))[:500],\n        )\n    except (OSError, ValueError) as exc:\n        return dict(name=path.name, kind=\"UNCLASSIFIED_LEGACY\", error=str(exc)[:500])\n\n\ndef collect_history(root, current_boot, keep=KEEP_HISTORY):\n    \"\"\"Caller holds launcher and device guards; never count unrelated files.\"\"\"\n    root = Path(root).resolve()\n    current_boot = boot_id(current_boot)\n    if current_boot is None:\n        raise RuntimeError(\"Current boot identity unavailable\")\n    if (root / \"UNKNOWN.json\").exists():\n        raise RuntimeError(\"Prior device session retained; inspect UNKNOWN.json\")\n    sessions = root / \"sessions\"\n    if sessions.is_symlink():\n        raise RuntimeError(\"sessions must be a real directory\")\n    sessions.mkdir(exist_ok=True)\n    candidates, ignored = [], 0\n    for path in sessions.iterdir():\n        if not path.name.startswith(\"camera_\") or path.is_symlink() or not path.is_dir():\n            ignored += 1\n            continue\n        candidates.append((path, classify(path, current_boot)))\n    unresolved = [\n        item\n        for _, item in candidates\n        if item[\"kind\"] in (\"UNRESOLVED_CURRENT_BOOT\", \"UNCLASSIFIED_LEGACY\")\n    ]\n    if unresolved:\n        names = \", \".join(item[\"name\"] for item in unresolved[:4])\n        raise RuntimeError(\"Unresolved session ownership; no history changed: \" + names)\n    active = read_json(root / \"ACTIVE_RUN.json\").get(\"session\")\n    # This board can return to an old calendar date at boot. Keep the last active\n    # run first and order this boot's histories by monotonic time, not wall time.\n    candidates.sort(\n        key=lambda pair: (\n            pair[0].name == active,\n            pair[1][\"boot\"] == current_boot,\n            pair[1][\"updated_monotonic_s\"] if pair[1][\"boot\"] == current_boot else 0,\n            pair[0].stat().st_mtime_ns,\n            pair[0].name,\n        ),\n        reverse=True,\n    )\n    retained, pruned = candidates[:keep], candidates[keep:]\n    report = dict(\n        boot=current_boot,\n        checked_monotonic_s=time.monotonic(),\n        policy=\"Keep four safe histories plus the next/current run; old boot is not a live owner\",\n        ignored_entries=ignored,\n        retained=[item for _, item in retained],\n        pruned_count=len(pruned),\n        pruned=[item for _, item in pruned[:16]],\n        pruned_list_truncated=len(pruned) > 16,\n        applied=False,\n    )\n    # A single bounded report preserves the reason without relabelling an abrupt\n    # power cut as device_closed=true or maintaining an unbounded archive.\n    atomic_json(root / \"SESSION_RETENTION.json\", report)\n    for path, _ in pruned:\n        if path.resolve().parent != sessions or path.is_symlink():\n            raise RuntimeError(\"Session path changed during history collection\")\n        shutil.rmtree(path)\n    report[\"applied\"] = True\n    atomic_json(root / \"SESSION_RETENTION.json\", report)\n    if shutil.disk_usage(root).free \u003c 512 * 1024 * 1024:\n        raise RuntimeError(\"Less than512MiB free; export records and free space\")\n    return report\n\n\ndef maintain_sessions(root):\n    # The caller already owns launcher.lock. A worker left alive by a failed\n    # launcher still owns DEVICE_LOCK and therefore blocks both GC and restart.\n    current_boot = Path(\"/proc/sys/kernel/random/boot_id\").read_text().strip()\n    with device_guard():\n        return collect_history(root, current_boot)\n\n\ndef prepare_session(path, current_boot):\n    \"\"\"Validate identity; the unchanged worker exclusively creates the directory.\n\n    The boot suffix identifies a power cut even before state.json is written.\n    Do not pre-create this directory: the accepted worker uses exist_ok=False.\n    \"\"\"\n    current_boot = boot_id(current_boot)\n    if not current_boot or not path.name.endswith(\"_b\" + current_boot.replace(\"-\", \"\")):\n        raise RuntimeError(\"New session requires its complete boot identity\")\n    if path.exists():\n        raise RuntimeError(\"Session already exists; refusing to reuse it\")\n", "sha256": "10364b90e2567804b07cdfc587cbe01678d90a784981601c8e4b3a4168a1c7ca", "functions": [{"name": "boot_id", "line": 23, "end": 27}, {"name": "read_json", "line": 30, "end": 36}, {"name": "atomic_json", "line": 39, "end": 42}, {"name": "device_guard", "line": 46, "end": 61}, {"name": "classify", "line": 64, "end": 94}, {"name": "collect_history", "line": 97, "end": 159}, {"name": "maintain_sessions", "line": 162, "end": 167}, {"name": "prepare_session", "line": 170, "end": 180}]}, {"group": "检测主循环", "path": "src/board/runtime/worker.py", "name": "worker.py", "desc": "连接采集、常驻推理、输入校验、FPGA提交和画面发布。", "content": "\"\"\"采集相机图像，调用NPU，提交检测框并发布画面。\"\"\"\n\nimport os, sys, json, math, time, hashlib, fcntl, ctypes, socket, struct, subprocess, threading, signal, csv, traceback\nfrom pathlib import Path\nimport cv2, numpy as np\nfrom collections import deque\nfrom runtime_log import RollingText, PipeLog\nfrom policy import boxes_q16, hit, expected, Ownership, fresh\nfrom motion_tracker_m355 import MotionTracker\nfrom mpeg4_writer_native_m388 import MPEG4Writer\nfrom native_center_pack_m93 import pack\nfrom pipeline import FileFrames, VideoSink\nfrom renderer import RenderWriter\nfrom media_fast import MediaSink\nfrom observability import MAGIC, read_observability\n\nROOT = Path(__file__).resolve().parent\n\n\n# 会话内必须成立的条件；失败交给main记录，不把异常改写为正常空帧。\ndef need(x, s):\n    if not x:\n        raise RuntimeError(s)\n\n\n# 校验文件的实际字节身份，用于本次运行配置与受保护文件检查。\ndef digest(p):\n    return hashlib.sha256(Path(p).read_bytes()).hexdigest()\n\n\n# 先写同目录临时JSON再替换，查看服务只会读到完整的新旧版本之一。\ndef save(p, x):\n    temp = p.with_suffix(p.suffix + \".tmp\")\n    temp.write_text(json.dumps(x, ensure_ascii=False, allow_nan=False), encoding=\"utf-8\")\n    os.replace(str(temp), str(p))\n\n\n# 输出一条完整JSON并立即刷新；父进程负责排空管道和日志轮转。\ndef emit(x):\n    print(json.dumps(x, ensure_ascii=False, allow_nan=False), flush=True)\n\n\n# SOCK_STREAM不保留消息边界，循环接收至n字节；EOF属于未完成响应。\ndef exact(ch, n):\n    b = bytearray()\n    while len(b) \u003c n:\n        d = ch.recv(n - len(b))\n        need(bool(d), \"NPU socket EOF\")\n        b.extend(d)\n    return bytes(b)\n\n\n# CPU侧的PL事务适配。这里只把原始框提交给硬件，不直接决定LED亮灭。\nclass Hardware:\n    # 借用已持有的锁fd映射业务寄存器；C库验证真实锁和硬件签名。\n    def __init__(self, fd):\n        self.lib = ctypes.CDLL(str(ROOT / \"libswitch_mmio.so\"))\n        self.lib.switch_open.argtypes = [ctypes.c_int]\n        self.lib.switch_read.argtypes = [ctypes.c_uint32, ctypes.POINTER(ctypes.c_uint32)]\n        self.lib.switch_write.argtypes = [ctypes.c_uint32, ctypes.c_uint32]\n        self.lib.switch_snapshot.argtypes = [ctypes.POINTER(ctypes.c_uint32)]\n        self.lib.switch_snapshot.restype = ctypes.c_int\n        need(self.lib.switch_open(fd) == 0, \"M512/lock mapping failed\")\n        self.writes = 0\n        self.observation_supported = self.read(0x40) == MAGIC\n        self.observation = {\"supported\": False, \"reason\": \"OBS1 extension absent\"}\n        self.observation_at = float(\"-inf\")\n\n    # offset按字节计；返回32位寄存器值，C层保留MMIO顺序屏障。\n    def read(self, o):\n        v = ctypes.c_uint32()\n        need(self.lib.switch_read(o, ctypes.byref(v)) == 0, \"MMIO read\")\n        return v.value\n\n    # 限定为BEGIN、两半坐标、COMMIT及事件清除；产品路径不允许写业务复位。\n    def write(self, o, v):\n        need(o in (4, 8, 12, 16, 0x38), \"No reset/other write permitted\")\n        need(self.lib.switch_write(o, v) == 0, \"MMIO write\")\n        self.writes += 1\n\n    # 有序读取签名、状态、末帧、接收/拒绝/协议错计数及事件；不是硬件原子快照。\n    def snapshot(self):\n        values = (ctypes.c_uint32 * 7)()\n        need(self.lib.switch_snapshot(values) == 0, \"Guarded MMIO snapshot\")\n        return dict(zip((\"192\", \"32\", \"36\", \"40\", \"44\", \"48\", \"52\"), values))\n\n    def observer_state(self, force=False):\n        # 平时每秒读一次，发生事件时立即更新；保留最新记录供状态和导出使用。\n        if not self.observation_supported:\n            return self.observation\n        now = time.monotonic()\n        if force or now - self.observation_at >= 1.0:\n            self.observation = read_observability(self.read)\n            self.observation_at = now\n        return self.observation\n\n    # 输入fid和最多16个Q16框。先计算CPU参考，再完成一次BEGIN→框→COMMIT。\n    # 提交后核对帧号、接受计数、状态和事件；任何不符都不记作成功提交。\n    def commit(self, fid, boxes):\n        before = self.snapshot()\n        need(before[\"192\"] == 0xA5050001, \"Signature changed\")\n        need(before[\"44\"] == 0 and before[\"48\"] == 0, \"Existing protocol rejection/error\")\n        e = expected(before, fid, boxes)\n        if before[\"52\"]:\n            self.write(0x38, before[\"52\"])\n        self.write(4, fid)\n        for x, y, u, v in boxes:\n            self.write(8, x | (y \u003c\u003c 16))\n            self.write(12, u | (v \u003c\u003c 16))\n        self.write(16, (len(boxes) \u003c\u003c 8) | 1)\n        after = self.snapshot()\n        need(\n            after[\"36\"] == fid\n            and after[\"40\"] == ((before[\"40\"] + 1) & 0xFFFFFFFF)\n            and after[\"44\"] == 0\n            and after[\"48\"] == 0,\n            \"PL commit acknowledgement mismatch\",\n        )\n        need(after[\"32\"] == e[\"status\"] and after[\"52\"] == e[\"events\"], \"CPU/PL state mismatch\")\n        if after[\"52\"]:\n            self.write(0x38, after[\"52\"])\n        return dict(\n            before=before,\n            after=after,\n            CPU=e,\n            exact=True,\n            observability=self.observer_state(force=bool(after[\"52\"])),\n        )\n\n\n# 每个检测会话仅创建一个持久C++进程，模型加载一次后逐请求推理。\n# 父子进程共享设备所有权；只有完整回执才能证明一次推理已完成。\nclass NPU:\n    # 通过socketpair传原始图像，单独排空stdout/stderr；RGB1表示SDK会话已就绪。\n    # PRODUCT_MAX_FORWARDS=0表示持续运行，必须与Python的帧数/时长限制一起解释。\n    def __init__(self, fd, c, out):\n        self.journal = RollingText(out / \"forward_journal.jsonl\")\n        self.calls = 0\n        self.outstanding = False\n        self.p = None\n        self.ch = None\n        self.out = out\n        parent, child = socket.socketpair()\n        parent.settimeout(30)\n        self.ch = parent\n        env = dict(os.environ, **c[\"runtime_env\"])\n        env.update(\n            M834_EXPECTED_BOOT=c[\"boot\"],\n            M834_GUARD_FD=str(fd),\n            PRODUCT_MAX_FORWARDS=str(c[\"max_forwards\"]),\n        )\n        self.logs = []\n        self.loading = True\n        self.p = subprocess.Popen(\n            [str(ROOT / \"product_stream\"), str(ROOT / \"int8.yaml\"), str(child.fileno())],\n            pass_fds=(fd, child.fileno()),\n            stdin=subprocess.DEVNULL,\n            stdout=subprocess.PIPE,\n            stderr=subprocess.PIPE,\n            env=env,\n            cwd=str(ROOT),\n        )\n        child.close()\n        self.logs = [\n            PipeLog(self.p.stdout, out / \"npu.stdout\"),\n            PipeLog(self.p.stderr, out / \"npu.stderr\"),\n        ]\n        parent.settimeout(60)\n        need(exact(parent, 4) == b\"RGB1\", \"NPU protocol readiness\")\n        parent.settimeout(15)\n        self.loading = False\n\n    # 将本次输入序号、几何和不可变字节发给C++；SHA在forward开始后计算以重叠CPU开销。\n    # 响应为12字节头、88字节阶段耗时、每框24字节；返回像素xyxy框和计时列表。\n    def infer(self, image):\n        profile_begin = time.monotonic_ns()\n        h, w = image.shape[:2]\n        compact = image.shape == (1080, 1920, 3) and image.flags.c_contiguous\n        raw = (pack(image) if compact else np.ascontiguousarray(image)).tobytes()\n        index = self.calls\n        # Record intent before any SDK work. Each immutable input still receives SHA256;\n        # checksum computation overlaps the C++ forward instead of delaying its start.\n        self.journal.write(\n            json.dumps(dict(index=index, phase=\"PREPARED\", width=w, height=h, input_bytes=len(raw)))\n            + \"\\n\"\n        )\n        self.journal.flush()\n        prepared = time.monotonic_ns()\n        self.calls += 1\n        self.outstanding = True\n        self.ch.sendall(\n            struct.pack(\"\u003c4I\", 0x33534750 if compact else 0x46504741, index & 0xFFFFFFFF, w, h)\n            + raw\n        )\n        sent = time.monotonic_ns()\n        input_sha = digest_bytes(raw)\n        self.journal.write(\n            json.dumps(\n                dict(index=index, phase=\"INPUT_SHA256\", input_SHA=input_sha, width=w, height=h)\n            )\n            + \"\\n\"\n        )\n        self.journal.flush()\n        hashed = time.monotonic_ns()\n        magic, returned, n = struct.unpack(\"\u003c3I\", exact(self.ch, 12))\n        need(\n            magic == 0x50524C39 and returned == (index & 0xFFFFFFFF) and n \u003c= 300,\n            \"Invalid response header\",\n        )\n        times = struct.unpack(\"\u003c11d\", exact(self.ch, 88))\n        rows = [struct.unpack(\"\u003c6f\", exact(self.ch, 24)) for _ in range(n)]\n        self.outstanding = False\n        detections = [\n            dict(\n                class_id=int(k),\n                confidence=float(s),\n                xyxy=[float(x), float(y), float(x) + float(u), float(y) + float(v)],\n            )\n            for k, x, y, u, v, s in rows\n        ]\n        need(all(k == 0 for k, x, y, u, v, s in rows), \"Unknown class\")\n        self.profile = dict(\n            prepare_hash_journal=(prepared - profile_begin) / 1e6,\n            hash_overlap=(hashed - sent) / 1e6,\n            send=(sent - prepared) / 1e6,\n            wait_decode=(time.monotonic_ns() - sent) / 1e6,\n            guard=times[3],\n            receive_cpp=times[4],\n            picture=times[5],\n            tensor=times[6],\n            dma=times[7],\n            forward=times[8],\n            reset=times[9],\n            post=times[10],\n        )\n        return detections, list(times[:3])\n\n    # 仅在没有加载/未回执请求时发送零尺寸退出包，等待C++正常Device::Close。\n    # 返回False表示设备工作状态未确定，调用者必须保留所有权，不能按已关闭处理。\n    def close(self):\n        if self.outstanding or self.loading:\n            return False\n        if self.p is None:\n            return True\n        self.ch.sendall(struct.pack(\"\u003c4I\", 0x46504741, 0, 0, 0))\n        self.ch.close()\n        self.ch = None\n        need(self.p.wait(timeout=20) == 0, \"NPU completion exit failed\")\n        [log.close() for log in self.logs]\n        self.journal.close()\n        return True\n\n\n# 输入是本次实际发送的图像字节，不能拿路径或重新采集的下一帧代替。\ndef digest_bytes(x):\n    return hashlib.sha256(x).hexdigest()\n\n\n# 相机读取独立于推理，只保存最新完整帧一个槽，避免把延迟积压成无限队列。\nclass Latest:\n    # 只给采集子进程相机参数，不传SDK设备锁；采集异常由reader回传。\n    def __init__(self, device, out, fps):\n        self.cv = threading.Condition()\n        self.latest = None\n        self.error = None\n        self.count = 0\n        self.err = None\n        self.p = subprocess.Popen(\n            [sys.executable, \"-B\", \"-u\", str(ROOT / \"capture.py\"), device, str(fps)],\n            stdout=subprocess.PIPE,\n            stderr=subprocess.PIPE,\n            close_fds=True,\n        )\n        self.err = PipeLog(self.p.stderr, out / \"capture.stderr\")\n        self.t = threading.Thread(target=self.reader, daemon=True)\n        self.t.start()\n\n    # 校验32字节CAM1包头后读取640×480×3字节，再在条件锁内一次替换最新帧。\n    def reader(self):\n        # 管道读取也可能短读；不足一帧时继续读，生产者退出则显式失败。\n        def read(n):\n            b = bytearray()\n            while len(b) \u003c n:\n                x = self.p.stdout.read(n - len(b))\n                if not x:\n                    raise RuntimeError(\"Camera producer stopped\")\n                b.extend(x)\n            return bytes(b)\n\n        try:\n            while True:\n                m, seq, ts, w, h, n = struct.unpack(\"\u003cIQQIII\", read(32))\n                need(m == 0x43414D31 and (w, h, n) == (640, 480, 921600), \"Camera packet contract\")\n                raw = read(n)\n                with self.cv:\n                    self.latest = (seq, ts, np.frombuffer(raw, np.uint8).reshape(h, w, 3))\n                    self.count += 1\n                    self.cv.notify_all()\n        except Exception as e:\n            with self.cv:\n                self.error = str(e)\n                self.cv.notify_all()\n\n    # 只返回序号大于last的完整帧；deadline到期返回None，由主循环判定输入故障。\n    def get(self, last, deadline):\n        with self.cv:\n            while self.latest is None or self.latest[0] \u003c= last:\n                if self.error:\n                    raise RuntimeError(self.error)\n                t = deadline - time.monotonic()\n                if t \u003c= 0:\n                    return None\n                self.cv.wait(min(t, 0.2))\n            return self.latest\n\n    # 这里只回收无SDK的相机子进程；该强制回收手段不适用于持有NPU的进程。\n    def close(self):\n        if self.p.poll() is None:\n            self.p.terminate()\n            try:\n                self.p.wait(timeout=3)\n            except subprocess.TimeoutExpired:\n                self.p.kill()\n                self.p.wait(timeout=3)  # camera only, no SDK/lock\n        self.p.stdout.close()\n        self.err.close()\n\n\n# 从/proc取RSS和可用内存，单位KiB；资源采样不进入目标检测判定。\ndef resource():\n    # 进程可能刚退出；读不到RSS时用None表示未知，不伪造为0。\n    def rss(pid):\n        try:\n            return int(\n                next(\n                    x.split()[1]\n                    for x in Path(\"/proc/%d/status\" % pid).read_text().splitlines()\n                    if x.startswith(\"VmRSS:\")\n                )\n            )\n        except (OSError, StopIteration):\n            return None\n\n    return dict(\n        parent_RSS_KiB=rss(os.getpid()),\n        MemAvailable_KiB=int(\n            next(\n                x.split()[1]\n                for x in Path(\"/proc/meminfo\").read_text().splitlines()\n                if x.startswith(\"MemAvailable:\")\n            )\n        ),\n    )\n\n\n# 读取本boot本次运行配置并持有真实设备锁，执行采集→NPU→原始框校验→PL提交。\n# 处理次数、NPU调用和PL提交分别计数；finally负责SDK关闭确认与故障状态发布。\ndef main():\n    c = json.loads((ROOT / \"contract.json\").read_text())\n    name = sys.argv[1]\n    p = c[\"sessions\"][name]\n    out = ROOT / \"sessions\" / name\n    out.mkdir(parents=True, exist_ok=False)\n    need(Path(\"/proc/sys/kernel/random/boot_id\").read_text().strip() == c[\"boot\"], \"Boot changed\")\n    for n, h in c[\"payload_SHA\"].items():\n        need(digest(ROOT / n) == h, \"Payload changed: \" + n)\n    need(not (ROOT / \"UNKNOWN.json\").exists(), \"Retained previous device owner\")\n    # 真实设备锁在SDK前获取，并传给C++；不允许删除锁文件或在未知会话后另开设备。\n    fd = os.open(\"/root/fpga_gaming/ps_session_m53.lock\", os.O_RDWR | os.O_NOFOLLOW)\n    need(os.fstat(fd).st_ino == 943514, \"Real lock differs\")\n    fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)\n    loopstart = None\n    started = time.monotonic()\n    hw = Hardware(fd)\n    initial = hw.snapshot()\n    owner = Ownership(initial)\n    npu = None\n    capture = None\n    file = None\n    encoder = None\n    frames = commits = unknown = 0\n    last = -1\n    fid = (initial[\"36\"] + 2) & 0xFFFFFFFF\n    gap = True\n    tracker = MotionTracker()\n    err = None\n    closed = False\n    # 内存仅保留最近1500次资源采样；逐帧检测日志滚动写盘，不在Python列表中无限积累。\n    resources = deque(maxlen=1500)\n    stop = False\n    recorded = 0\n\n    # 信号处理器只置退出意图；等当前推理返回后走正常关闭，不在信号里释放设备。\n    def onstop(*_):\n        nonlocal stop\n        stop = True\n\n    signal.signal(signal.SIGTERM, onstop)\n\n    # 持续覆盖状态文件，同时写有界输出日志；界面以boot、阶段和更新时间判断新鲜度。\n    def publish(phase, **kw):\n        state = dict(\n            type=\"state\",\n            session=name,\n            input_mode=p[\"mode\"],\n            phase=phase,\n            updated_monotonic_s=time.monotonic(),\n            elapsed_s=time.monotonic() - started,\n            frames=frames,\n            NPU_calls=npu.calls if npu else 0,\n            commits=commits,\n            unknown=unknown,\n            boot=c[\"boot\"],\n            hardware_observability=hw.observer_state(),\n            **kw\n        )\n        if loopstart is not None:\n            state.update(\n                inference_loop_seconds=time.monotonic() - loopstart,\n                processing_fps=frames / max(time.monotonic() - loopstart, 1e-9),\n            )\n        save(out / \"state.json\", state)\n        emit(state)\n\n    publish(\"STARTING\", initial_PL=initial, inherited_alarm=bool(initial[\"32\"] & 1))\n    try:\n        for path, h in c[\"protected_files\"].items():\n            need(digest(path) == h, \"Protected original changed\")\n        need(resource()[\"MemAvailable_KiB\"] >= 131072, \"Memory floor\")\n        # Open/load inference first, then obtain fresh camera frames; never infer a pre-load queue.\n        # 先加载NPU再开相机，首个推理输入因此来自加载后的新鲜帧。\n        # 先分配实例是为了构造失败时finally仍能检查其设备是否已打开。\n        npu = NPU.__new__(NPU)\n        NPU.__init__(npu, fd, dict(c, max_forwards=p[\"max_forwards\"]), out)\n        after_load = hw.snapshot()\n        need(\n            all(initial[k] == after_load[k] for k in [\"192\", \"36\", \"40\", \"44\", \"48\"])\n            and (initial[\"32\"] & 1) == (after_load[\"32\"] & 1),\n            \"Model load changed retained alarm/counters\",\n        )\n        if p[\"mode\"] == \"camera\":\n            capture = Latest(c[\"camera_device\"], out, p.get(\"capture_fps\", 15))\n        else:\n            need(digest(c[\"file_source\"]) == c[\"file_SHA\"], \"Fixed file changed\")\n            file = FileFrames(c[\"file_source\"])\n            need(file.isOpened(), \"File source failed\")\n        loopstart = time.monotonic()\n        gap_done = False\n        next_due = loopstart\n        first_frame_at = None\n        with RollingText(out / \"frames.jsonl\") as rawlog, RollingText(\n            out / \"events.csv\", header=\"frame,monotonic_s,event_bits,alarm,fault,source\\n\"\n        ) as ef:\n            ew = csv.writer(ef)\n            while (\n                not stop\n                and (not p[\"max_forwards\"] or frames \u003c p[\"max_forwards\"])\n                and (not p[\"seconds\"] or time.monotonic() - loopstart \u003c p[\"seconds\"])\n            ):\n                need(\n                    Path(\"/proc/sys/kernel/random/boot_id\").read_text().strip() == c[\"boot\"],\n                    \"Boot changed\",\n                )\n                if (out / \"STOP\").exists():\n                    stop = True\n                    break\n                t = time.monotonic()\n                rate = p.get(\"service_rate_hz\", 0)\n                if capture and rate > 0:\n                    if t \u003c next_due:\n                        time.sleep(next_due - t)\n                    next_due = max(next_due + 1.0 / rate, time.monotonic())\n                if (\n                    p.get(\"gap_after_s\") is not None\n                    and not gap_done\n                    and t - loopstart >= p[\"gap_after_s\"]\n                ):\n                    gap_done = True\n                    before = hw.snapshot()\n                    publish(\"FAULT_INJECTION_NO_SUBMIT\", PL=before)\n                    time.sleep(1.25)\n                    after = hw.snapshot()\n                    need(\n                        after[\"32\"] & 2\n                        and (after[\"32\"] & 1) == (before[\"32\"] & 1)\n                        and after[\"40\"] == before[\"40\"],\n                        \"No-submit fault/hold failed\",\n                    )\n                    gap = True\n                    owner.unknown()\n                    tracker = MotionTracker()\n                    ew.writerow(\n                        [frames, time.monotonic(), 4, bool(after[\"32\"] & 1), True, p[\"mode\"]]\n                    )\n                    ef.flush()\n                    publish(\"RECOVERING\", PL=after)\n                if capture:\n                    item = capture.get(last, time.monotonic() + 0.5)\n                    if item is None:\n                        if frames == 0:\n                            need(\n                                time.monotonic() - loopstart \u003c 30,\n                                \"Camera first-frame deadline30s exceeded\",\n                            )\n                            publish(\"WAITING_FIRST_FRAME\", PL=hw.snapshot())\n                            continue\n                        # 等待相机超时记unknown并打断连续性，不能伪装成一次“没有无人机”的负观测。\n                        unknown += 1\n                        gap = True\n                        owner.unknown()\n                        publish(\"INPUT_FAULT\", PL=hw.snapshot())\n                        continue\n                    seq, received, im = item\n                    if not fresh(seq, last, received, time.monotonic_ns()):\n                        unknown += 1\n                        gap = True\n                        owner.unknown()\n                        publish(\"STALE_INPUT_FAULT\", PL=hw.snapshot())\n                        continue\n                    last = seq\n                    if first_frame_at is None:\n                        first_frame_at = time.monotonic() - loopstart\n                else:\n                    ok, im = file.read()\n                    if not ok:\n                        break\n                    received = time.monotonic_ns()\n                    seq = frames\n                hw_start = time.monotonic()\n                before = hw.snapshot()\n                begin = time.monotonic()\n                detections, stages = npu.infer(im)\n                end = time.monotonic()\n                frames += 1\n                after = hw.snapshot()\n                need(\n                    all(before[k] == after[k] for k in [\"192\", \"36\", \"40\", \"44\", \"48\"])\n                    and (before[\"32\"] & 1) == (after[\"32\"] & 1),\n                    \"NPU forward changed retained business state\",\n                )\n                hw_checked = time.monotonic()\n                reason = None\n                pl = None\n                ownership_hold = False\n                try:\n                    # 推理前新鲜不代表推理后仍新鲜；完成回执后再检查500ms帧龄。\n                    if capture and time.monotonic_ns() - received > 500000000:\n                        raise ValueError(\"Result frame-age exceeded500ms\")\n                    q = boxes_q16(detections, im.shape[1], im.shape[0])\n                    positive = hit(q)\n                    if not owner.allow(positive):\n                        ownership_hold = True\n                    if ownership_hold:\n                        raise ValueError(\"INHERITED_ALARM_HOLD\")\n                    # 恢复时主动跳过一个业务序号，让PL丢弃中断前的连续计数。\n                    if gap:\n                        fid = (fid + 2) & 0xFFFFFFFF\n                        tracker = MotionTracker()\n                        gap = False\n                    pl = hw.commit(fid, q)\n                    fid = (fid + 1) & 0xFFFFFFFF\n                    commits += 1\n                except (ValueError, AssertionError) as e:\n                    reason = str(e)\n                if reason:\n                    if not ownership_hold:\n                        unknown += 1\n                    gap = True\n                    owner.unknown()\n                pl_done = time.monotonic()\n                # PL使用的是detections原始框；跟踪器随后只为画面补ID，stale框不能重送为新命中。\n                tracks = tracker.update(detections) if reason is None else []\n                tracked = time.monotonic()\n                row = dict(\n                    profile_ms=dict(\n                        npu.profile,\n                        hw_pre=(begin - hw_start) * 1000,\n                        hw_post=(hw_checked - end) * 1000,\n                        alarm=(pl_done - hw_checked) * 1000,\n                        track=(tracked - pl_done) * 1000,\n                    ),\n                    frame=frames - 1,\n                    capture_sequence=seq,\n                    received_monotonic_ns=received,\n                    completed_monotonic_ns=time.monotonic_ns(),\n                    detections=detections,\n                    tracks=tracks,\n                    PL=pl,\n                    unknown_reason=reason,\n                    stages_ms=stages,\n                    request_response_ms=(end - begin) * 1000,\n                    receive_to_result_ms=(time.monotonic_ns() - received) / 1e6,\n                )\n                rawlog.write(json.dumps(row, allow_nan=False) + \"\\n\")\n                rawlog.flush()\n                pass  # No per-frame in-memory history\n                if pl and pl[\"CPU\"][\"events\"]:\n                    ew.writerow(\n                        [\n                            frames - 1,\n                            time.monotonic(),\n                            pl[\"CPU\"][\"events\"],\n                            pl[\"CPU\"][\"alarm\"],\n                            False,\n                            p[\"mode\"],\n                        ]\n                    )\n                    ef.flush()\n                phase = (\n                    \"INHERITED_ALARM_HOLD\"\n                    if ownership_hold\n                    else (\"OBSERVATION_FAULT\" if reason else \"RUNNING\")\n                )\n                st = hw.snapshot()\n                if encoder is None:\n                    encoder = MediaSink(out, p[\"mode\"], record_limit=p[\"video_frames_max\"])\n                encoder.write(\n                    dict(\n                        image=im,\n                        detections=detections,\n                        tracks=tracks,\n                        status=st,\n                        frames=frames,\n                        phase=phase,\n                        record=p[\"video_frames_max\"] > 0,\n                        capture_sequence=seq,\n                        received_monotonic_ns=received,\n                        media_source_ns=received,\n                    )\n                )\n                media_stats = encoder.stats()\n                recorded = media_stats[\"record_written\"]\n                if frames % 5 == 0 or frames == 1:\n                    if frames % 30 == 0:\n                        resources.append(\n                            dict(\n                                at_s=time.monotonic() - loopstart,\n                                NPU_RSS_KiB=int(\n                                    next(\n                                        x.split()[1]\n                                        for x in Path(\"/proc/%d/status\" % npu.p.pid)\n                                        .read_text()\n                                        .splitlines()\n                                        if x.startswith(\"VmRSS:\")\n                                    )\n                                ),\n                                **resource()\n                            )\n                        )\n                        save(out / \"resources.json\", list(resources))\n                    publish(\n                        phase,\n                        PL=st,\n                        capture_sequence=seq,\n                        receive_to_result_ms=row[\"receive_to_result_ms\"],\n                        model=\"11\",\n                        hardware=\"M512\",\n                        recorded_video_frames=recorded,\n                        reason=reason,\n                        media=media_stats,\n                        input_verification_mode=\"full\",\n                    )\n                if p[\"seconds\"]:\n                    need(\n                        time.monotonic() - started \u003c p[\"seconds\"] + 120, \"Whole session wall budget\"\n                    )\n            duration = time.monotonic() - loopstart\n        # 仅零退出码且已确认Device::Close才进入成功收尾；完成处理帧数本身不证明SDK关闭。\n        closed = npu.close()\n        need(closed, \"Device completion unknown; owner retained\")\n        media_final = None\n        if encoder:\n            encoder.release()\n            media_final = encoder.stats()\n            recorded = media_final[\"record_written\"]\n            encoder = None\n        duration = time.monotonic() - loopstart\n        final = hw.snapshot()\n        result = dict(\n            hardware_observability=hw.observer_state(force=True),\n            media=media_final,\n            input_verification_mode=\"full\",\n            input_hash_samples=npu.calls,\n            input_hash_skipped=0,\n            completed=True,\n            stopped=stop,\n            mode=p[\"mode\"],\n            frames=frames,\n            NPU_calls=npu.calls,\n            commits=commits,\n            unknown=unknown,\n            loop_seconds=duration,\n            processing_fps=frames / duration,\n            initial_PL=initial,\n            final_PL=final,\n            explicit_business_reset_writes=0,\n            SDK_device_reset_per_forward=True,\n            business_write_calls=hw.writes,\n            NPU_child_exit=npu.p.returncode,\n            video_frames=recorded,\n            source_received_frames=capture.count if capture else frames,\n            capture_gap_test=gap_done,\n            independent_accuracy=False,\n            physical_LED_verified=False,\n            camera_first_frame_wait_s=first_frame_at,\n            service_rate_cap_hz=p.get(\"service_rate_hz\", 0) if capture else None,\n            capture_requested_fps=p.get(\"capture_fps\"),\n        )\n    except Exception as e:\n        err = str(e)\n        result = dict(\n            completed=False,\n            error=err,\n            traceback=traceback.format_exc(),\n            frames=frames,\n            NPU_calls=npu.calls if npu else 0,\n            commits=commits,\n            unknown=unknown,\n            explicit_business_reset_writes=0,\n            SDK_device_reset_per_forward=True,\n        )\n    finally:\n        if capture:\n            capture.close()\n        if file:\n            file.release()\n        if encoder:\n            try:\n                encoder.release()\n            except Exception as e:\n                result[\"encoder_close_error\"] = str(e)\n        if npu and not closed:\n            try:\n                closed = npu.close()\n            except Exception as e:\n                result[\"NPU_close_error\"] = str(e)\n        if npu is None:\n            closed = True\n        result[\"device_closed\"] = closed\n        result[\"boot\"] = c[\"boot\"]\n        save(out / \"result.json\", result)\n        publish(\"COMPLETED\" if result[\"completed\"] else \"FAILED\", result=result)\n        # SDK关闭无法确认时，保留当前进程及继承锁并发布UNKNOWN_RETAINED，留待人工核对。\n        if not closed:\n            publish(\"UNKNOWN_RETAINED\", result=result)\n            save(\n                ROOT / \"UNKNOWN.json\",\n                dict(\n                    pid=os.getpid(),\n                    boot=c[\"boot\"],\n                    session=name,\n                    NPU_child=npu.p.pid if npu and npu.p else None,\n                ),\n            )\n            emit(dict(type=\"UNKNOWN_RETAINED\", PID=os.getpid(), error=err))\n            while True:\n                time.sleep(1)\n        hw.lib.switch_close()\n        os.close(fd)\n    emit(dict(type=\"terminal\", session=name, result=result))\n    return 0 if result[\"completed\"] else 1\n\n\nif __name__ == \"__main__\":\n    cv2.setNumThreads(1)\n    sys.exit(main())\n", "sha256": "4a59fd79a704a2ce0f8246fb7cad05d3214049c1eeba3bb2b4a9c5d6e6046489", "functions": [{"name": "need", "line": 21, "end": 23}, {"name": "digest", "line": 27, "end": 28}, {"name": "save", "line": 32, "end": 35}, {"name": "emit", "line": 39, "end": 40}, {"name": "exact", "line": 44, "end": 50}, {"name": "Hardware.__init__", "line": 56, "end": 67}, {"name": "Hardware.read", "line": 70, "end": 73}, {"name": "Hardware.write", "line": 76, "end": 79}, {"name": "Hardware.snapshot", "line": 82, "end": 85}, {"name": "Hardware.observer_state", "line": 87, "end": 95}, {"name": "Hardware.commit", "line": 99, "end": 128}, {"name": "NPU.__init__", "line": 136, "end": 171}, {"name": "NPU.infer", "line": 175, "end": 236}, {"name": "NPU.close", "line": 240, "end": 251}, {"name": "digest_bytes", "line": 255, "end": 256}, {"name": "Latest.__init__", "line": 262, "end": 276}, {"name": "Latest.reader", "line": 279, "end": 302}, {"name": "read", "line": 281, "end": 288}, {"name": "Latest.get", "line": 305, "end": 314}, {"name": "Latest.close", "line": 317, "end": 326}, {"name": "resource", "line": 330, "end": 353}, {"name": "rss", "line": 332, "end": 342}, {"name": "main", "line": 358, "end": 761}, {"name": "onstop", "line": 394, "end": 396}, {"name": "publish", "line": 401, "end": 423}]}, {"group": "检测主循环", "path": "src/board/runtime/capture.py", "name": "capture.py", "desc": "从V4L2彩色相机读入完整帧。", "content": "\"\"\"通过V4L2采集YUYV彩色图像，输出最新相机帧。\"\"\"\nimport cv2, os, signal, struct, sys, time, json\n\nrun = True\n\n\n# 相机进程只置退出标志，让read循环自然结束并执行release。\ndef stop(*_):\n    global run\n    run = False\n\n\nsignal.signal(signal.SIGTERM, stop)\n\n\n# 循环写stdout直到整个二进制包发送完；调试文字只能写stderr，不能混入图像协议。\ndef send(b):\n    p = memoryview(b).cast(\"B\")\n    while p:\n        n = os.write(1, p)\n        p = p[n:]\n\n\ncv2.setNumThreads(1)\nc = cv2.VideoCapture(sys.argv[1], cv2.CAP_V4L2)\ntry:\n    if not c.isOpened():\n        raise RuntimeError(\"D435i RGB open failed\")\n    c.set(cv2.CAP_PROP_FOURCC, cv2.VideoWriter_fourcc(*\"YUYV\"))\n    c.set(3, 640)\n    c.set(4, 480)\n    c.set(5, int(sys.argv[2]) if len(sys.argv) > 2 else 15)\n    c.set(cv2.CAP_PROP_BUFFERSIZE, 2)\n    print(\n        json.dumps(\n            dict(\n                type=\"capture_negotiated\",\n                requested_fps=int(sys.argv[2]) if len(sys.argv) > 2 else 15,\n                reported_fps=c.get(5),\n                reported_buffers=c.get(cv2.CAP_PROP_BUFFERSIZE),\n                width=c.get(3),\n                height=c.get(4),\n            )\n        ),\n        file=sys.stderr,\n        flush=True,\n    )\n    seq = 0\n    while run:\n        ok, im = c.read()\n        ts = time.monotonic_ns()\n        if not ok or im is None or im.shape != (480, 640, 3):\n            raise RuntimeError(\"RGB capture missing/shape changed\")\n        raw = im.tobytes()\n        send(struct.pack(\"\u003cIQQIII\", 0x43414D31, seq, ts, 640, 480, len(raw)))\n        send(raw)\n        seq += 1\nfinally:\n    c.release()\n", "sha256": "9d2b107bd78dffe80ac34a87224166faf7e36025ea2c457fd7be382891ef6e4a", "functions": [{"name": "stop", "line": 8, "end": 10}, {"name": "send", "line": 17, "end": 21}]}, {"group": "检测主循环", "path": "src/board/runtime/policy.py", "name": "policy.py", "desc": "Q16框转换、ROI命中和CPU告警参考状态。", "content": "\"\"\"计算Q16检测框、ROI命中和告警参考状态。\"\"\"\nimport math\n\nROI = (8192, 4096, 57344, 57344)\n\n\n# 将原始像素框规范化为Q16；超16框、越界或无效数值显式报错，不截断隐藏。\n# 输入原图像素xyxy和置信度，输出Q16整数四元组。\n# 四舍五入后夹到0..65535；无效框、归一化塌缩或超过16框都报错，不能悄悄删框。\ndef boxes_q16(boxes, w, h):\n    if not (w > 0 and h > 0):\n        raise ValueError(\"Invalid frame geometry\")\n    if len(boxes) > 16:\n        raise ValueError(\"More than16 raw boxes: explicit FAULT, no silent truncation\")\n    out = []\n    for d in boxes:\n        b = d[\"xyxy\"]\n        s = d[\"confidence\"]\n        if (\n            len(b) != 4\n            or not all(math.isfinite(x) for x in list(b) + [s])\n            or not 0 \u003c= s \u003c= 1\n            or d.get(\"class_id\", 0) != 0\n        ):\n            raise ValueError(\"Malformed raw box\")\n        x, y, u, v = b\n        # 框经float32的x、宽分别传回后再相加，边缘可能多出约0.00002像素。\n        # 仅在Q16转换时收回这点舍入误差；原始检测框和分数仍保留。\n        eps_x, eps_y = w * 2.0**-22, h * 2.0**-22\n        if not (-eps_x \u003c= x \u003c u \u003c= w + eps_x and -eps_y \u003c= y \u003c v \u003c= h + eps_y):\n            raise ValueError(\"Box outside native content\")\n        b = [max(0.0, x), max(0.0, y), min(float(w), u), min(float(h), v)]\n        q = [\n            max(0, min(65535, math.floor(t * 65536.0 / size + 0.5)))\n            for t, size in zip(b, [w, h, w, h])\n        ]\n        if not (q[0] \u003c q[2] and q[1] \u003c q[3]):\n            raise ValueError(\"Collapsed normalized box\")\n        out.append(q)\n    return out\n\n\n# 判断至少一个框中心位于半开ROI内，边界与RTL一致。\n# 用两个端点之和比较两倍ROI边界，不先做整数除法，边界与RTL半开区间一致。\ndef hit(boxes):\n    return any(\n        2 * ROI[0] \u003c= b[0] + b[2] \u003c 2 * ROI[2] and 2 * ROI[1] \u003c= b[1] + b[3] \u003c 2 * ROI[3]\n        for b in boxes\n    )\n\n\n# 计算下次成功提交后的参考状态；它用于校验，不直接驱动LED。\n# before的键是寄存器字节偏移的十进制字符串。\n# 帧号按32位模差判断新旧；跳号重建连续性，断流后的首帧同时记录恢复事件。\ndef expected(before, fid, boxes):\n    status = before[\"32\"]\n    fault = bool(status & 2)\n    last = before[\"36\"]\n    delta = (fid - last) & 0xFFFFFFFF\n    if before[\"40\"] and not (0 \u003c delta \u003c 0x80000000):\n        raise ValueError(\"Nonfresh hardware frame id\")\n    consecutive = bool(status & 4) and delta == 1\n    p = 0 if fault else (status >> 4) & 15\n    n = 0 if fault else (status >> 8) & 15\n    a = bool(status & 1)\n    old = a\n    positive = hit(boxes)\n    if positive:\n        n = 0\n        p = min(3, p + 1) if consecutive else 1\n        if consecutive and p >= 3:\n            a = True\n    else:\n        p = 0\n        n = min(8, n + 1) if consecutive else 1\n        if consecutive and n >= 8:\n            a = False\n    return dict(\n        status=int(a) | 4 | (p \u003c\u003c 4) | (n \u003c\u003c 8) | (int(positive) \u003c\u003c 12),\n        events=(8 if fault else 0) | ((1 if a else 2) if a != old else 0),\n        alarm=a,\n        positive=positive,\n    )\n\n\n# 继承已置位告警时，先建立本会话观测所有权，避免新会话直接清掉旧警。\n# 防止新会话在尚无自己的有效正观测时，直接用空帧解除继承下来的告警。\nclass Ownership:\n    # 从现有alarm位建立初始所有权；未继承告警时允许正常提交负观测。\n    def __init__(self, initial):\n        self.inherited_alarm = bool(initial[\"32\"] & 1)\n        self.own_positive = 0\n        self.clear_allowed = not self.inherited_alarm\n\n    # 命中可提交；继承告警时，先积累本会话三次正观测，之后才允许负观测清警。\n    def allow(self, positive):\n        if positive:\n            self.own_positive += 1\n            if self.own_positive >= 3:\n                self.clear_allowed = True\n            return True\n        self.own_positive = 0\n        return self.clear_allowed\n\n    # 未知观测打断本会话的正观测积累；不把未知输入算成一次空帧。\n    def unknown(self):\n        self.own_positive = 0\n\n\n# 相机序号必须递增，接收时间到当前的年龄须在0到500ms内。\n# 相机序号严格递增，且接收到当前的帧龄在0..500ms内；时间戳均为单调时钟。\ndef fresh(sequence, last_sequence, received_ns, now_ns, max_age_ns=500000000):\n    return sequence > last_sequence and 0 \u003c= now_ns - received_ns \u003c= max_age_ns\n", "sha256": "2f942f793bcee02b974a1ba24b7a8e06e8c31abb467553361b714f347aeb2161", "functions": [{"name": "boxes_q16", "line": 10, "end": 40}, {"name": "hit", "line": 45, "end": 49}, {"name": "expected", "line": 55, "end": 83}, {"name": "Ownership.__init__", "line": 90, "end": 93}, {"name": "Ownership.allow", "line": 96, "end": 103}, {"name": "Ownership.unknown", "line": 106, "end": 107}, {"name": "fresh", "line": 112, "end": 113}]}, {"group": "检测主循环", "path": "src/board/runtime/observability.py", "name": "observability.py", "desc": "读回四类硬件事件的最近周期数与帧号。", "content": "\"\"\"通过当前设备会话读取四类硬件事件时间和帧号。\"\"\"\n\nMAGIC = 0x4F425331\nEVENT_NAMES = (\"alarm_assert\", \"alarm_clear\", \"stream_fault\", \"stream_recover\")\n\n\n# read32来自主循环已经持有的设备会话；此函数不另开设备，不写寄存器。\n# 事件序号变化或64位时钟跨32位边界时，整组重读，最多尝试max_attempts次。\n# supported=False表示旧硬件无此扩展；ready=False表示本次未取得一致快照。\ndef read_observability(read32, max_attempts=3):\n    if read32(0x40) != MAGIC:\n        return {\"supported\": False, \"reason\": \"OBS1 extension absent\"}\n    hz = read32(0x44)\n    if hz \u003c= 0:\n        return {\"supported\": True, \"ready\": False, \"reason\": \"Invalid hardware clock metadata\"}\n    # 前后事件序号相同且高位计数未翻转时，这组32位读取属于同一份记录。\n    for _ in range(max_attempts):\n        seq0 = read32(0x50)\n        hi0 = read32(0x4C)\n        lo = read32(0x48)\n        hi1 = read32(0x4C)\n        valid = read32(0x54) & 15\n        last_mask = read32(0x58) & 15\n        records = {}\n        for i, name in enumerate(EVENT_NAMES):\n            if valid & (1 \u003c\u003c i):\n                low = read32(0x60 + i * 8)\n                high = read32(0x64 + i * 8)\n                frame = read32(0x80 + i * 4)\n                # 两个32位寄存器组成周期数；除以clock_hz才是秒。\n                ticks = (high \u003c\u003c 32) | low\n                records[name] = {\"cycles\": ticks, \"frame\": frame}\n        seq1 = read32(0x50)\n        if hi0 == hi1 and seq0 == seq1:\n            return {\n                \"supported\": True,\n                \"ready\": True,\n                \"clock_hz\": hz,\n                \"now_cycles\": (hi1 \u003c\u003c 32) | lo,\n                \"event_seq\": seq1,\n                \"valid_mask\": valid,\n                \"last_mask\": last_mask,\n                \"events\": records,\n                \"epoch\": \"hardware business_reset; not UTC\",\n                \"record_scope\": \"latest occurrence per type; not a complete event log\",\n            }\n    return {\"supported\": True, \"ready\": False, \"reason\": \"Hardware changed during bounded read\"}\n", "sha256": "c410cf48dcabb09d8a60cc0fd90a1c8f5f340ba0dbf792acaa961e81dfe43266", "functions": [{"name": "read_observability", "line": 10, "end": 47}]}, {"group": "检测主循环", "path": "src/board/runtime/media_fast.py", "name": "media_fast.py", "desc": "分别安排有界预览队列和录像编码。", "content": "\"\"\"分别安排预览发布和录像编码。\"\"\"\nfrom pathlib import Path\nimport json, os, queue, threading, time\nimport cv2\nfrom renderer import draw\nfrom runtime_log import RollingText\n\n\n# 显示/录像消费者不持设备锁。预览容量1、录像队列2，推理结果仍由worker逐帧记录。\nclass MediaSink:\n    # 建立相互独立的预览和录像线程；先等编码器就绪，失败立即回传给主会话。\n    def __init__(\n        self,\n        out,\n        mode,\n        record_limit=1200,\n        record_hz=10,\n        preview_hz=10,\n        writer_factory=None,\n        draw_fn=None,\n        clock=None,\n    ):\n        self.out = Path(out)\n        self.mode = mode\n        self.record_limit = record_limit\n        self.record_period_ns = int(1e9 / record_hz)\n        self.preview_period = 1.0 / preview_hz\n        self.clock = clock or time.monotonic\n        self.draw = draw_fn or draw\n        self.cv = threading.Condition()\n        self.latest = None\n        self.q = queue.Queue(2)\n        self.closed = False\n        self.errors = []\n        self.next_record_ns = None\n        self.start = self.clock()\n        self.record_ready = threading.Event()\n        self.c = dict(\n            submitted=0,\n            preview_overwritten=0,\n            preview_written=0,\n            record_requested=0,\n            record_not_due=0,\n            record_eligible=0,\n            record_enqueued=0,\n            record_queue_dropped=0,\n            record_limit_reached=0,\n            record_written=0,\n            record_encode_ns=0,\n            preview_publish_ns=0,\n        )\n        if writer_factory is None:\n\n            # 延迟加载CPU编码库；录像以源时间戳写PTS，名义10Hz不是检测帧率。\n            def writer_factory():\n                from mpeg4_writer_timed import TimestampedMPEG4Writer\n\n                return TimestampedMPEG4Writer(\n                    str(self.out / \"preview.mp4\"), float(record_hz), (640, 480), threads=1\n                )\n\n        self.writer_factory = writer_factory\n        self.preview_thread = threading.Thread(\n            target=self._preview, name=\"preview-latest\", daemon=True\n        )\n        self.record_thread = threading.Thread(\n            target=self._record, name=\"record-bounded\", daemon=True\n        )\n        self.preview_thread.start()\n        self.record_thread.start()\n        if not self.record_ready.wait(10):\n            raise RuntimeError(\"Record consumer readiness timeout\")\n        try:\n            self.check()\n        except Exception:\n            self.release()\n            raise\n\n    # 在生产者线程显式传播消费者异常，避免后台线程已经失败而页面继续显示正常。\n    def check(self):\n        with self.cv:\n            if self.errors:\n                raise RuntimeError(\"Media consumer failure: \" + self.errors[0])\n\n    # 在条件锁内保存错误并唤醒等待者，由主线程统一处理。\n    def _fail(self, exc):\n        with self.cv:\n            self.errors.append(str(exc))\n            self.cv.notify_all()\n\n    # 输入一次已完成推理的图像/原始框/PL状态。复制会被跟踪器修改的字典。\n    # 预览覆盖旧槽；录像按源时间采样，队列满记overload，不能混同计划采样或漏检。\n    def write(self, job):\n        self.check()\n        # Source images and raw detections are immutable until consumed. Track\n        # dictionaries are copied because the next tracker update may edit them.\n        item = dict(job)\n        item[\"tracks\"] = [dict(t, xyxy=list(t[\"xyxy\"])) for t in job[\"tracks\"]]\n        stamp = int(\n            item.get(\"media_source_ns\", item.get(\"received_monotonic_ns\", time.monotonic_ns()))\n        )\n        with self.cv:\n            if self.closed:\n                raise RuntimeError(\"Media sink already closed\")\n            self.c[\"submitted\"] += 1\n            if self.latest is not None:\n                self.c[\"preview_overwritten\"] += 1\n            self.latest = item\n            self.cv.notify_all()\n            if not item[\"record\"]:\n                return\n            self.c[\"record_requested\"] += 1\n            if self.c[\"record_enqueued\"] >= self.record_limit:\n                self.c[\"record_limit_reached\"] += 1\n                return\n            if self.next_record_ns is not None and stamp \u003c self.next_record_ns:\n                self.c[\"record_not_due\"] += 1\n                return\n            self.next_record_ns = stamp + self.record_period_ns\n            self.c[\"record_eligible\"] += 1\n            try:\n                self.q.put_nowait(item)\n                self.c[\"record_enqueued\"] += 1\n            except queue.Full:\n                self.c[\"record_queue_dropped\"] += 1\n\n    # 在锁内取最新结果，锁外绘制/JPEG编码；临时文件替换同时保留该画面的来源帧号。\n    def _preview(self):\n        next_at = 0.0\n        try:\n            while True:\n                with self.cv:\n                    while self.latest is None and not self.closed:\n                        self.cv.wait()\n                    if self.latest is None and self.closed:\n                        return\n                    wait = next_at - self.clock()\n                    if wait > 0 and not self.closed:\n                        self.cv.wait(wait)\n                        continue\n                    job = self.latest\n                    self.latest = None\n                begin = time.monotonic_ns()\n                view = self.draw(job, self.mode)\n                ok, jpg = cv2.imencode(\".jpg\", view, [cv2.IMWRITE_JPEG_QUALITY, 75])\n                if not ok:\n                    raise RuntimeError(\"Preview JPEG encoding failed\")\n                temp = self.out / \"latest.jpg.tmp\"\n                temp.write_bytes(jpg.tobytes())\n                os.replace(temp, self.out / \"latest.jpg\")\n                published = time.monotonic_ns()\n                # 保存已编码帧与源时间的对应关系。\n                meta = dict(\n                    result_frame=job[\"frames\"] - 1,\n                    source_sequence=job.get(\"capture_sequence\"),\n                    received_monotonic_ns=job.get(\"received_monotonic_ns\"),\n                    published_monotonic_ns=published,\n                )\n                temp = self.out / \"preview_meta.json.tmp\"\n                temp.write_text(json.dumps(meta))\n                os.replace(temp, self.out / \"preview_meta.json\")\n                with self.cv:\n                    self.c[\"preview_written\"] += 1\n                    self.c[\"preview_publish_ns\"] += published - begin\n                next_at = self.clock() + self.preview_period\n        except Exception as exc:\n            self._fail(exc)\n\n    # 单线程写MP4与video_map映射；结束哨兵排在已入队帧之后，确保正常排空。\n    def _record(self):\n        writer = None\n        mapping = None\n        try:\n            if self.record_limit > 0:\n                writer = self.writer_factory()\n                mapping = RollingText(self.out / \"video_map.jsonl\")\n            self.record_ready.set()\n            while True:\n                job = self.q.get()\n                if job is None:\n                    return\n                begin = time.monotonic_ns()\n                view = self.draw(job, self.mode)\n                source_ns = int(job.get(\"media_source_ns\", job[\"received_monotonic_ns\"]))\n                pts_ms = writer.write_at(view, source_ns)\n                with self.cv:\n                    index = self.c[\"record_written\"]\n                    self.c[\"record_written\"] += 1\n                    self.c[\"record_encode_ns\"] += time.monotonic_ns() - begin\n                mapping.write(\n                    json.dumps(\n                        dict(\n                            encoded_frame=index,\n                            result_frame=job[\"frames\"] - 1,\n                            source_sequence=job.get(\"capture_sequence\"),\n                            received_ns=job.get(\"received_monotonic_ns\"),\n                            media_source_ns=job.get(\"media_source_ns\"),\n                            nominal_fps=10,\n                            time_base=\"1/1000\",\n                            pts_ms=pts_ms,\n                            variable_frame_timestamps=True,\n                        )\n                    )\n                    + \"\\n\"\n                )\n                mapping.flush()\n        except Exception as exc:\n            self._fail(exc)\n            self.record_ready.set()\n        finally:\n            if writer:\n                try:\n                    writer.release()\n                except Exception as exc:\n                    self._fail(exc)\n            if mapping:\n                mapping.close()\n\n    # 分别报告预览发布、计划录像、过载丢弃和实际编码计数，不能把显示FPS当检测FPS。\n    def stats(self):\n        with self.cv:\n            elapsed = max(self.clock() - self.start, 1e-9)\n            return dict(\n                self.c,\n                elapsed_s=elapsed,\n                preview_publish_fps=self.c[\"preview_written\"] / elapsed,\n                recorded_frames_per_wall_s=self.c[\"record_written\"] / elapsed,\n                preview_latest_capacity=1,\n                record_queue_capacity=2,\n                record_target_hz=1e9 / self.record_period_ns,\n                nominal_fps=10,\n                variable_frame_timestamps=True,\n                record_policy=\"source-time sampling; intentional not_due separate from overload drop\",\n                video_time=\"VFR source timestamps; final sample duration100ms; video_map records actual encoded PTS\",\n            )\n\n    # 关闭生产入口，发送录像哨兵并有限等待两个线程；未正常结束则抛错，不冒称录像关闭。\n    def release(self):\n        with self.cv:\n            if self.closed:\n                return\n            self.closed = True\n            self.cv.notify_all()\n        if self.record_thread.is_alive():\n            try:\n                self.q.put(None, timeout=5)\n            except queue.Full:\n                raise RuntimeError(\"Record queue failed to drain\")\n        self.preview_thread.join(timeout=10)\n        self.record_thread.join(timeout=15)\n        if self.preview_thread.is_alive() or self.record_thread.is_alive():\n            raise RuntimeError(\"Media consumer failed to close\")\n        self.check()\n", "sha256": "ad62eed043eebe79389dc0906ddaf26426ed424b1a94015631d6b662bcd232ed", "functions": [{"name": "MediaSink.__init__", "line": 12, "end": 77}, {"name": "writer_factory", "line": 55, "end": 60}, {"name": "MediaSink.check", "line": 80, "end": 83}, {"name": "MediaSink._fail", "line": 86, "end": 89}, {"name": "MediaSink.write", "line": 93, "end": 125}, {"name": "MediaSink._preview", "line": 128, "end": 167}, {"name": "MediaSink._record", "line": 170, "end": 217}, {"name": "MediaSink.stats", "line": 220, "end": 235}, {"name": "MediaSink.release", "line": 238, "end": 253}]}, {"group": "检测主循环", "path": "src/board/runtime/renderer.py", "name": "renderer.py", "desc": "绘制检测框、目标编号、ROI与告警状态。", "content": "\"\"\"绘制检测框、目标编号、ROI和告警状态。\"\"\"\nfrom pathlib import Path\nimport os, cv2, numpy as np\n\n\n# 画原始检测框，跟踪仅标ID；PL状态来自寄存器快照。\n# 绘制全部原始框，再叠加跟踪ID及stale标记；绘图不会增删用于PL判定的原始检测。\n# 画面缩放到640×480只用于显示，PL的Q16坐标来自原始输入几何。\ndef draw(job, mode):\n    im = job[\"image\"]\n    detections = job[\"detections\"]\n    tracks = job[\"tracks\"]\n    st = job[\"status\"]\n    frames = job[\"frames\"]\n    phase = job[\"phase\"]\n    view = cv2.resize(im, (640, 480))\n    sx, sy = 640 / im.shape[1], 480 / im.shape[0]\n    for d in detections:\n        x, y, u, v = d[\"xyxy\"]\n        cv2.rectangle(\n            view, (round(x * sx), round(y * sy)), (round(u * sx), round(v * sy)), (0, 255, 0), 2\n        )\n    for tr in tracks:\n        x, y, u, v = tr[\"xyxy\"]\n        cv2.putText(\n            view,\n            \"ID%d%s\" % (tr[\"track_id\"], \" stale\" if tr[\"missed\"] else \"\"),\n            (max(0, round(x * sx)), max(60, round(y * sy))),\n            0,\n            0.4,\n            (255, 220, 0),\n            1,\n        )\n    cv2.rectangle(view, (80, 30), (560, 420), (255, 160, 0), 1)\n    cv2.rectangle(view, (0, 0), (640, 48), (20, 20, 20), -1)\n    cv2.putText(\n        view,\n        \"MODEL11 / PL ALARM / \" + mode.upper() + \" / \" + phase,\n        (8, 18),\n        0,\n        0.43,\n        (255, 255, 255),\n        1,\n    )\n    cv2.putText(\n        view,\n        \"frame %d  ALARM %d  FAULT %d\" % (frames, st[\"32\"] & 1, bool(st[\"32\"] & 2)),\n        (8, 38),\n        0,\n        0.45,\n        (0, 120, 255) if st[\"32\"] & 1 else (100, 255, 100),\n        1,\n    )\n    return np.ascontiguousarray(view)\n\n\n# 按record开关写入有限录像，预览JPEG经临时文件原子替换。\n# 保留的旧展示编码入口；当前持续运行由MediaSink进行独立限速。\nclass RenderWriter:\n    # 仅创建CPU视频编码器，不持相机、NPU或MMIO资源。\n    def __init__(self, out, mode):\n        from mpeg4_writer_native_m388 import MPEG4Writer\n\n        self.out = Path(out)\n        self.mode = mode\n        self.writer = MPEG4Writer(str(self.out / \"preview.mp4\"), 10.0, (640, 480), threads=1)\n\n    # record只决定是否录制本张图，不能停止检测；旧预览策略每5个结果更新一次。\n    def write(self, job):\n        view = draw(job, self.mode)\n        if job[\"record\"]:\n            self.writer.write(view)\n        if job[\"frames\"] % 5 == 0 or job[\"frames\"] == 1:\n            ok, jpg = cv2.imencode(\".jpg\", view, [cv2.IMWRITE_JPEG_QUALITY, 75])\n            if not ok:\n                raise RuntimeError(\"Preview encoder failure\")\n            (self.out / \"latest.jpg.tmp\").write_bytes(jpg.tobytes())\n            os.replace(str(self.out / \"latest.jpg.tmp\"), str(self.out / \"latest.jpg\"))\n\n    # 提交视频尾部并释放编码器；主会话另行确认SDK关闭。\n    def release(self):\n        self.writer.release()\n", "sha256": "44ddc138726a969670a914a7b7a502334d17167b28f53b29b1e3d7838b4421a1", "functions": [{"name": "draw", "line": 9, "end": 54}, {"name": "RenderWriter.__init__", "line": 61, "end": 66}, {"name": "RenderWriter.write", "line": 69, "end": 78}, {"name": "RenderWriter.release", "line": 81, "end": 82}]}, {"group": "常驻推理", "path": "src/npu/product_stream.cpp", "name": "product_stream.cpp", "desc": "模型加载一次，按请求处理输入并返回检测框和阶段计时。", "content": "// 常驻的NPU推理进程：模型只加载一次，随后按顺序处理图像。\n// CPU先做颜色转换和补边，厂商推理图计算后，再由CPU解码并返回检测框。\n// 与Python父进程通过本地socket传图像和结果，字段采用小端格式。\n// 每帧完整回包后，worker才会把结果交给FPGA告警模块。\n\n#include \u003cicraft-xrt/core/session.h>\n#include \u003cicraft-xrt/dev/host_device.h>\n#include \u003cicraft-xrt/dev/buyi_device.h>\n#include \u003cicraft-xrt/dev/zg330_device.h>\n#include \u003cicraft-backends/buyibackend/buyibackend.h>\n#include \u003cicraft-backends/zg330backend/zg330backend.h>\n#include \u003cicraft-backends/hostbackend/cuda/device.h>\n#include \u003cicraft-backends/hostbackend/backend.h>\n#include \u003cicraft-backends/hostbackend/utils.h>\n#include \u003cchrono>\n#include \u003ccerrno>\n#include \u003ccstdint>\n#include \u003ccstring>\n#include \u003cstdexcept>\n#include \u003csys/socket.h>\n#include \u003cunistd.h>\n#include \"postprocess_yolo11.hpp\"\n#include \"icraft_utils.hpp\"\n#include \"yaml-cpp/yaml.h\"\n#include \"FusedStreamPicPre.hpp\"\n#include \"LegacyFusedStreamPicPre.hpp\"\n#include \"CenterPacketPicPre.hpp\"\n#include \"DirectTensor.hpp\"\n#include \"ProductGuard.hpp\"\n#include \"RoiSubset.hpp\"\n#include \u003cmemory>\n\nusing namespace icraft::xrt;\nusing namespace icraft::xir;\nusing Clock = std::chrono::steady_clock;\nconstexpr uint32_t REQUEST_MAGIC = 0x46504741;\nconstexpr uint32_t RESULT_MAGIC = 0x50524c39; // M506; strict new protocol\n\n// 流式socket可能短读；读满当前字段才解析，EINTR重试，EOF抛错。\n// 所有请求都顺序处理，不依赖一次recv恰好等于一帧。\nvoid receive_exact(int fd, void *data, size_t size) {\n    auto *bytes = static_cast\u003cchar *>(data);\n    while (size) {\n        const auto count = recv(fd, bytes, size, 0);\n        if (count \u003c 0 && errno == EINTR)\n            continue;\n        if (count \u003c= 0)\n            throw std::runtime_error(\"stream input closed or failed\");\n        bytes += count;\n        size -= count;\n    }\n}\n\n// 发送完整字段，MSG_NOSIGNAL让断开的父进程表现为异常而非异步SIGPIPE。\nvoid send_exact(int fd, const void *data, size_t size) {\n    const auto *bytes = static_cast\u003cconst char *>(data);\n    while (size) {\n        const auto count = send(fd, bytes, size, MSG_NOSIGNAL);\n        if (count \u003c 0 && errno == EINTR)\n            continue;\n        if (count \u003c= 0)\n            throw std::runtime_error(\"stream output closed or failed\");\n        bytes += count;\n        size -= count;\n    }\n}\n\n// steady_clock只用于阶段耗时，返回毫秒；这些分段不能单独当作整机FPS。\ndouble milliseconds(Clock::time_point start, Clock::time_point end) {\n    return std::chrono::duration\u003cdouble, std::milli>(end - start).count();\n}\n\n// 用旧CPU实现作为字节和几何参考，检查缩放比、补边及像素完全一致。\n// 此函数不执行NPU，不以两次不同模型输出代替输入一致性验证。\nvoid compare_picture(const cv::Mat &body, std::pair\u003cint, int> target) {\n    FusedStreamPicPre current(body, target);\n    LegacyFusedStreamPicPre reference(body, target);\n    require(current.dst_img.size() == reference.dst_img.size() &&\n                current.dst_img.type() == reference.dst_img.type() &&\n                current.getPadInfo() == reference.getPadInfo() &&\n                current.getResizedHW() == reference.getResizedHW() &&\n                current.getResizedRatio() == reference.getResizedRatio(),\n            \"Preprocess geometry mismatch\");\n    require(cv::norm(current.dst_img, reference.dst_img, cv::NORM_INF) == 0,\n            \"Preprocess pixel mismatch\");\n}\n// 正常入口参数是配置文件和继承socket fd；--cpu-preprocess-check是无SDK的离线自检。\nint main(int argc, char **argv) {\n    if (argc == 2 && std::string(argv[1]) == \"--cpu-preprocess-check\") {\n        cv::setNumThreads(1);\n        for (int width : {17, 31, 37, 640}) {\n            cv::Mat storage(480, width + 7, CV_8UC3);\n            cv::randu(storage, 0, 256);\n            auto body = storage(cv::Rect(0, 0, width, 480));\n            compare_picture(body, {640, width});\n        }\n        for (auto size : {cv::Size(640, 480), cv::Size(640, 640), cv::Size(800, 600)}) {\n            cv::Mat body(size, CV_8UC3);\n            cv::randu(body, 0, 256);\n            compare_picture(body, {640, 640});\n        }\n        std::cout \u003c\u003c \"CPU_PREPROCESS_BYTES_GEOMETRY_MATCH cases=7 SDK_open=0\\n\";\n        return 0;\n    }\n    if (argc != 3) {\n        std::cerr \u003c\u003c \"Usage: drone_yolo11_stream_arm64 \u003cconfig.yaml> \u003csocket-fd>\\n\";\n        return 2;\n    }\n    try {\n        cv::setNumThreads(1); // Avoid per-frame parallel color/resize scheduling on the small CPU.\n        product_guard();\n        const int fd = std::stoi(argv[2]);\n        // 0表示持续；非0才检查前向上限。不能仅去掉Python的1800秒限制而遗留C++次数上限。\n        const uint64_t max_forwards = std::stoull(std::getenv(\"PRODUCT_MAX_FORWARDS\"));\n        if (max_forwards > 2000000)\n            throw std::runtime_error(\n                \"Invalid finite forward limit\"); // zero explicitly means continuous\n        auto config = YAML::LoadFile(argv[1]);\n        roi_m705::Roi roi = roi_m705::DEFAULT;\n        if (config[\"business_roi\"]) {\n            auto values = config[\"business_roi\"].as\u003cstd::vector\u003cint64_t>>();\n            if (values.size() != 4)\n                throw std::runtime_error(\"Four ROI coordinates required\");\n            for (int i = 0; i \u003c 4; i++) {\n                if (values[i] \u003c 0 || values[i] > 65536)\n                    throw std::runtime_error(\"Invalid ROI integer\");\n                roi[i] = uint32_t(values[i]);\n            }\n        }\n        roi_m705::validate(roi); // Before opening any SDK device.\n        auto model = config[\"imodel\"];\n        const auto backend = model[\"run_backend\"].as\u003cstd::string>();\n        if (backend != \"zg330\")\n            throw std::runtime_error(\"stream worker requires real zg330 backend\");\n        auto stage = model[\"stage\"].as\u003cstd::string>();\n        // 按zg330后端加载同一份JSON/raw；不是在板端重新训练、量化或导出模型。\n        auto paths = getJrPath(backend, model[\"dir\"].as\u003cstd::string>(), stage);\n        auto network = loadNetwork(paths.first, paths.second);\n        NetInfo info(network);\n        auto param = config[\"param\"];\n        const float confidence = param[\"conf\"].as\u003cfloat>();\n        const float nms_iou = param[\"iou_thresh\"].as\u003cfloat>();\n        bool multilabel = param[\"multilabel\"].as\u003cbool>();\n        bool fpga_nms = param[\"fpga_nms\"].as\u003cbool>();\n        const int classes = param[\"number_of_class\"].as\u003cint>();\n        const int heads = param[\"number_of_head\"].as\u003cint>();\n        auto anchors = param[\"anchors\"].as\u003cstd::vector\u003cstd::vector\u003cstd::vector\u003cfloat>>>>();\n        auto labels = toVector(config[\"dataset\"][\"names\"].as\u003cstd::string>());\n        // 现用图包含厂商DetPost硬件处理，后面的CPU解码/NMS仍存在。\n        // 这部分厂商PL能力与自研告警RTL分别说明，不能把整个推理IP算作自研。\n        if (info.DetPost_on)\n            updateDetpost(info, confidence);\n        auto device = openDevice(backend, model[\"ip\"].as\u003cstd::string>(), true, false);\n        auto session = initSession(backend, network, device, model[\"ocm_option\"].as\u003cint>(), true,\n                                   model[\"speedmode\"].as\u003cbool>(), model[\"compressFtmp\"].as\u003cbool>());\n        session.enableTimeProfile(true);\n        session.apply();\n        std::vector\u003cstd::vector\u003cfloat>> norms;\n        std::vector\u003cint> real_channels;\n        auto strides = get_stride(info);\n        if (info.DetPost_on) {\n            real_channels = _getReal_out_channles({classes, 64}, info.detpost_bit, classes);\n            auto scales = info.o_scale;\n            norms = set_norm_by_head(heads, 2, scales);\n        }\n        bool show = false, save = false;\n        std::string result_root, name;\n        // PL decisions belong to the guarded parent after frame-age/validity checks.\n        // 模型及SDK会话apply完成才发就绪标记。父进程从此开始获取新鲜相机帧，避免回放加载前积压。\n        send_exact(fd, \"RGB1\", 4);\n        std::cout \u003c\u003c \"NPU_STREAM_READY\\n\" \u003c\u003c std::flush;\n        CenterPacketStorage center_storage;\n        size_t processed = 0;\n        // 单请求串行执行，响应顺序为3个uint32、11个double、每框6个float，均小端。\n        for (;;) {\n            // 请求头16字节：[magic, 序号, 原宽, 原高]，小端uint32。\n            // 普通请求随后是width×height×3 BGR；1920×1080紧凑请求只传640×360采样BGR。\n            uint32_t request[4];\n            receive_exact(fd, request, sizeof(request));\n            if (request[0] != REQUEST_MAGIC && request[0] != CENTER_REQUEST_MAGIC)\n                throw std::runtime_error(\"bad stream request magic\");\n            // 零宽/零高仅对普通magic表示正常结束；不会把一次坏图像当成退出后继续运行。\n            if (request[0] == REQUEST_MAGIC && !request[2] && !request[3])\n                break;\n            if (max_forwards && processed >= max_forwards)\n                throw std::runtime_error(\"Forward budget exhausted\");\n            const auto guard_begin = Clock::now();\n            product_guard();\n            const auto guard_end = Clock::now();\n            const uint32_t width = request[2], height = request[3];\n            if (!width
