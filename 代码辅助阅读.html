"复旦微 FMQL30TAI 悟净开发板 · 完整版\", 9.5F, Theme.Ink, 0, 79, 405, 22);\n        board.TextAlign = ContentAlignment.MiddleRight;\n        var toolbar = new Panel() { Dock = DockStyle.Top, Height = 67 };\n        workspace.Controls.Add(toolbar);\n        start = Button(toolbar, \"▶  启动检测\", 0, 6, 140, Theme.Blue, Color.White);\n        stop = Button(toolbar, \"■  正常停止\", 152, 6, 140, Color.White, Theme.Ink);\n        export = Button(toolbar, \"↓  导出记录\", 304, 6, 140, Color.White, Theme.Ink);\n        var actionTips = new ToolTip();\n        actionTips.SetToolTip(start, \"通过已授权SSH连接请求板端启动检测。\");\n        actionTips.SetToolTip(stop, \"通过已授权SSH请求正常停止；等待当前推理与SDK关闭。\");\n        actionTips.SetToolTip(export, \"将当前会话的板端记录导出为ZIP。\");\n        actionTips.SetToolTip(navMonitor, \"查看实时画面、运行状态和硬件告警。\");\n        actionTips.SetToolTip(navRecords, \"查看当前会话最近的告警与故障事件。\");\n        actionTips.SetToolTip(nav3, \"设置板卡地址及认证信息；只查看画面不需要私钥。\");\n        address = L(toolbar, \"\", 9, Theme.Muted, 470, 14, 450, 28);\n        address.Anchor = AnchorStyles.Top | AnchorStyles.Left | AnchorStyles.Right;\n        start.Click += async delegate { await Control(\"start\"); };\n        stop.Click += async delegate { await Control(\"stop\"); };\n        export.Click += async delegate { await Export(); };\n        var footer = new Panel() { Dock = DockStyle.Bottom, Height = 43 };\n        workspace.Controls.Add(footer);\n        notice =\n            L(footer, \"检测由板端运行。关闭本程序不会停止检测。\", 9, Theme.Muted, 0, 12, 1050, 26);\n        notice.Anchor = AnchorStyles.Top | AnchorStyles.Left | AnchorStyles.Right;\n        var host = new Panel() { Dock = DockStyle.Fill };\n        workspace.Controls.Add(host);\n        workspace.Controls.SetChildIndex(host, 0);\n        workspace.Controls.SetChildIndex(toolbar, 1);\n        workspace.Controls.SetChildIndex(header, 2);\n        workspace.Controls.SetChildIndex(footer, 3);\n        monitor = new Panel() { Dock = DockStyle.Fill };\n        host.Controls.Add(monitor);\n        var columns = new TableLayoutPanel() { Dock = DockStyle.Fill, ColumnCount = 2, RowCount = 1,\n                                               BackColor = Theme.Bg };\n        columns.ColumnStyles.Add(new ColumnStyle(SizeType.Percent, 100));\n        columns.ColumnStyles.Add(new ColumnStyle(SizeType.Absolute, 320));\n        monitor.Controls.Add(columns);\n        var camera = new Card() { Dock = DockStyle.Fill, Padding = new Padding(0),\n                                  Margin = new Padding(0, 0, 18, 0) };\n        columns.Controls.Add(camera, 0, 0);\n        var camTop = new Panel() { Dock = DockStyle.Top, Height = 57, BackColor = Color.White };\n        L(camTop, \"实时画面\", 12, Theme.Ink, 19, 15, 160, 26, FontStyle.Bold);\n        pausePreview = Button(camTop, \"暂停画面\", 155, 8, 95, Color.White, Theme.Ink);\n        pausePreview.Height = 38;\n        savePreview = Button(camTop, \"保存画面\", 258, 8, 95, Color.White, Theme.Ink);\n        savePreview.Height = 38;\n        pausePreview.Click += delegate { TogglePreview(); };\n        savePreview.Click += delegate { SavePreview(); };\n        var tips = new ToolTip();\n        tips.SetToolTip(pausePreview, \"暂停或恢复本机显示（空格）；不向板端发送停止请求。\");\n        tips.SetToolTip(savePreview, \"保存当前预览画面（Ctrl+S），画面可能包含检测框和状态叠层。\");\n        displayRate = L(camTop, \"画面更新 / 秒 —\", 8, Theme.Muted, camTop.Width - 158, 18, 145, 22);\n        displayRate.Anchor = AnchorStyles.Top | AnchorStyles.Right;\n        camera.Controls.Add(camTop);\n        var camFoot = new Panel() { Dock = DockStyle.Bottom, Height = 52, BackColor = Color.White };\n        L(camFoot, \"绿色框：本帧检测   蓝色区域：告警区域   空格：暂停画面   Ctrl+S：保存\", 9, Theme.Muted, 16,\n          14, 700, 24);\n        camera.Controls.Add(camFoot);\n        video = new VideoSurface() { Dock = DockStyle.Fill };\n        camera.Controls.Add(video);\n        camera.Controls.SetChildIndex(video, 0);\n        camera.Controls.SetChildIndex(camTop, 1);\n        camera.Controls.SetChildIndex(camFoot, 2);\n        var status = new Card() { Dock = DockStyle.Fill, Margin = new Padding(0), AutoScroll = true,\n                                  Padding = new Padding(0) };\n        columns.Controls.Add(status, 1, 0);\n        L(status, \"运行概览\", 12, Theme.Ink, 22, 20, 240, 28, FontStyle.Bold);\n        phase = L(status, \"正在连接\", 21, Theme.Muted, 20, 64, 260, 42, FontStyle.Bold);\n        reason = L(status, \"等待板端状态\", 9, Theme.Muted, 22, 112, 260, 49);\n        frames = L(status, \"—\", 22, Theme.Ink, 22, 181, 135, 40, FontStyle.Bold);\n        fps = L(status, \"—\", 22, Theme.Ink, 160, 181, 125, 40, FontStyle.Bold);\n        L(status, \"已处理帧\", 9, Theme.Muted, 24, 224, 128, 25);\n        L(status, \"检测 FPS\", 9, Theme.Muted, 162, 224, 128, 25);\n        Divider(status, 270);\n        L(status, \"PL 硬件告警\", 9, Theme.Muted, 22, 287, 240, 24);\n        alarm = L(status, \"等待状态\", 18, Theme.Muted, 22, 318, 260, 35, FontStyle.Bold);\n        L(status, \"输入链路\", 9, Theme.Muted, 22, 372, 240, 24);\n        fault = L(status, \"等待状态\", 12, Theme.Muted, 22, 402, 260, 30, FontStyle.Bold);\n        Divider(status, 450);\n        duration = StatusLine(status, \"运行时长\", 470);\n        commits = StatusLine(status, \"有效提交\", 512);\n        age = StatusLine(status, \"状态帧龄\", 554);\n        records = new Card() { Dock = DockStyle.Fill, Visible = false, Padding = new Padding(20) };\n        host.Controls.Add(records);\n        L(records, \"当前会话告警记录\", 17, Theme.Ink, 22, 16, 700, 38, FontStyle.Bold);\n        recordInfo = L(records, \"板端滚动记录；以下最多显示100条，完整记录请导出ZIP。\", 9,\n                       Theme.Muted, 24, 62, 900, 28);\n        var refresh = Button(records, \"刷新记录\", 22, 100, 120, Color.White, Theme.Ink);\n        refresh.Click += async delegate { await LoadEvents(); };\n        eventGrid = new DataGridView() { Anchor = AnchorStyles.Top | AnchorStyles.Bottom |\n                                                  AnchorStyles.Left | AnchorStyles.Right,\n                                         Location = new Point(22, 159),\n                                         Size = new Size(records.Width - 44, records.Height - 182),\n                                         BackgroundColor = Color.White,\n                                         BorderStyle = BorderStyle.None,\n                                         ReadOnly = true,\n                                         AllowUserToAddRows = false,\n                                         AllowUserToDeleteRows = false,\n                                         RowHeadersVisible = false,\n                                         AutoSizeColumnsMode = DataGridViewAutoSizeColumnsMode.Fill,\n                                         SelectionMode = DataGridViewSelectionMode.FullRowSelect,\n                                         Font = Theme.Font(10) };\n        eventGrid.Columns.Add(\"frame\", \"结果帧\");\n        eventGrid.Columns.Add(\"time\", \"板端单调时间 / s\");\n        eventGrid.Columns.Add(\"event\", \"事件\");\n        eventGrid.Columns.Add(\"alarm\", \"告警状态\");\n        records.Controls.Add(eventGrid);\n        navMonitor.Click += delegate {\n            monitor.Visible = true;\n            records.Visible = false;\n            monitor.BringToFront();\n            SetNavigation(true);\n        };\n        navRecords.Click += async delegate {\n            monitor.Visible = false;\n            records.Visible = true;\n            records.BringToFront();\n            SetNavigation(false);\n            await LoadEvents();\n        };\n        nav3.Click += delegate {\n            using (var d = new Settings()) if (d.ShowDialog(this) == DialogResult.OK) {\n                address.Text = Api.Base(Api.Config);\n                notice.Text = \"连接已更新；读取状态不会启动板端推理。\";\n            }\n        };\n        help.Click += delegate {\n            MessageBox.Show(\n                this,\n                \"1. 接好摄像头并给板卡上电，检测自动运行。\\n2. 本程序直接查看板端画面；首次手动控制需在连接设置中选择已授权SSH密钥。\\n3. 正常停止后等待“已停止”，SDK正常关闭后再断电。\\n4. 重要记录及时导出；录像完整封装需正常停止。\\n\\n复制整个软件文件夹到Windows10/11 x64即可运行，无需Python、浏览器或系统SSH。新电脑仍需连接到板卡网络并配置自己的认证。\\n\\n目前存在误检；此程序不会更改模型阈值、告警规则或位流。\",\n            \"操作说明\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n        };\n        address.Text = Api.Base(Api.Config);\n        Resize += delegate {\n            eventGrid.Size =\n                new Size(Math.Max(300, records.Width - 44), Math.Max(160, records.Height - 182));\n        };\n    }\n    void SetNavigation(bool viewingMonitor) {\n        navMonitor.ActiveNavigation = viewingMonitor;\n        navRecords.ActiveNavigation = !viewingMonitor;\n        navMonitor.Fill = viewingMonitor ? Color.FromArgb(42, 66, 103) : Theme.Navy;\n        navRecords.Fill = viewingMonitor ? Theme.Navy : Color.FromArgb(42, 66, 103);\n        navMonitor.Ink = viewingMonitor ? Color.White : Color.FromArgb(179, 194, 216);\n        navRecords.Ink = viewingMonitor ? Color.FromArgb(179, 194, 216) : Color.White;\n        navMonitor.Border = navMonitor.Fill; navRecords.Border = navRecords.Fill;\n        navMonitor.Invalidate(); navRecords.Invalidate();\n    }\n    void TogglePreview() {\n        if (lastPreview == null && !viewPaused) {\n            notice.Text = \"当前还没有可暂停的画面。\";\n            return;\n        }\n        viewPaused = !viewPaused;\n        video.DisplayPaused = viewPaused;\n        pausePreview.Text = viewPaused ? \"恢复画面\" : \"暂停画面\";\n        if (viewPaused) {\n            displayRate.Text = \"画面已暂停\";\n            notice.Text = \"仅暂停本机画面显示；没有向板端发送停止请求。\";\n        } else {\n            previewRequested = true;\n            previewFreshness.Restart();\n            displayClock.Restart(); displayed = 0;\n            notice.Text = \"已恢复画面显示；板端运行状态不受影响。\";\n        }\n        video.Invalidate();\n    }\n    void SavePreview() {\n        if (lastPreview == null) {\n            notice.Text = \"当前没有可保存的预览画面。\";\n            return;\n        }\n        // Capture the frame at click time; polling may continue while the dialog is open.\n        byte[] captured = lastPreview;\n        using (var dialog = new SaveFileDialog() {\n            Title = \"保存当前预览画面\", Filter = \"JPEG图片|*.jpg\",\n            FileName = \"无人机检测画面_\" + DateTime.Now.ToString(\"yyyyMMdd_HHmmss\") + \".jpg\"\n        }) {\n            if (dialog.ShowDialog(this) != DialogResult.OK) return;\n            try {\n                WritePreview(dialog.FileName, captured);\n                notice.Text = \"画面已保存：\" + dialog.FileName;\n            } catch (Exception ex) {\n                notice.Text = \"保存画面失败：\" + ex.Message;\n                MessageBox.Show(this, ex.Message, \"保存失败\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n            }\n        }\n    }\n    static void WritePreview(string path, byte[] jpeg) {\n        if (jpeg == null || jpeg.Length == 0) throw new InvalidOperationException(\"当前没有可保存的预览画面。\");\n        File.WriteAllBytes(path, jpeg);\n    }\n    void Divider(Control p, int y) {\n        var line = new Panel() { BackColor = Theme.Line };\n        line.SetBounds(22, y, 260, 1);\n        p.Controls.Add(line);\n    }\n    Label StatusLine(Control p, string text, int y) {\n        L(p, text, 9, Theme.Muted, 22, y, 125, 29);\n        return L(p, \"—\", 10, Theme.Ink, 151, y, 130, 29, FontStyle.Bold);\n    }\n    static string Phase(string v) {\n        switch (v) {\n        case \"RUNNING\":\n            return \"正在检测\";\n        case \"STARTING\":\n        case \"ACTIVE\":\n            return \"正在启动\";\n        case \"STOPPING\":\n            return \"正在正常停止\";\n        case \"STOPPED\":\n        case \"COMPLETED\":\n            return \"已停止\";\n        case \"WAITING_CAMERA\":\n            return \"等待摄像头\";\n        case \"WAITING_FIRST_FRAME\":\n            return \"等待首帧\";\n        case \"UNKNOWN_RETAINED\":\n            return \"设备状态未知\";\n        case \"INHERITED_ALARM_HOLD\":\n            return \"保留先前告警\";\n        case \"STALE_INPUT\":\n        case \"STALE_INPUT_FAULT\":\n            return \"输入已过期\";\n        case \"INPUT_FAULT\":\n            return \"输入中断\";\n        case \"FAILED\":\n            return \"运行失败\";\n        default:\n            return \"等待状态\";\n        }\n    }\n    // 后台轮询有防重入，界面线程只更新控件。\n    // 状态轮询防重入。boot或session变化时废弃旧预览身份，防止上一会话画面看似仍在实时更新。\n    async Task Poll() {\n        if (polling || closing)\n            return;\n        polling = true;\n        try {\n            var state = await Task.Run(() => Api.State());\n            if (closing)\n                return;\n            snapshot = state;\n            UpdateState(snapshot);\n            string session = J.S(J.G(J.G(state, \"active\"), \"session\")) + \":\" + J.S(J.G(state, \"boot\"));\n            if (session != previewSession) {\n                previewSession = session;\n                lastPreview = null;\n                displayed = 0;\n                displayClock.Restart();\n                previewFreshness.Restart();\n                // A frame from the previous session must never look live in the new session.\n                video.PreviewStale = true;\n            }\n            previewAvailable = J.B(J.G(state, \"preview_available\"));\n            if (!previewAvailable && video.Live && !viewPaused && previewFreshness.Elapsed.TotalSeconds >= 2) {\n                video.PreviewStale = true;\n                video.Invalidate();\n            }\n            previewRequested = true;\n        } catch (Exception) {\n            if (!closing) {\n                previewAvailable = false;\n                connection.Text = \"●  未连接\";\n                connection.ForeColor = Theme.Red;\n                phase.Text = \"连接中断\";\n                phase.ForeColor = Theme.Muted;\n                reason.Text = \"请检查板卡电源、网线与连接设置。\";\n                video.Live = false;\n                video.PreviewStale = false;\n                video.Message = \"板卡未连接\\n最后画面仅供回看\";\n                video.Invalidate();\n                alarm.Text = \"未知\";\n                fault.Text = \"连接中断\";\n                fault.ForeColor = Theme.Red;\n            }\n        } finally {\n            polling = false;\n        }\n    }\n    // 仅用于判断JPEG是否换帧；静止场景也可能相同，不能据此判定NPU故障或无目标。\n    static bool SameImage(byte[] a, byte[] b) {\n        if (a == null || b == null || a.Length != b.Length) return false;\n        for (int i = 0; i \u003c a.Length; i++) if (a[i] != b[i]) return false;\n        return true;\n    }\n    // 只获取最新JPEG，不积压显示任务；await返回后复核窗口、暂停和会话身份。\n    // 预览刷新率独立于板端processing_fps，断图只提示画面待恢复。\n    async Task PollPreview() {\n        if (closing || viewPaused || previewPolling || !previewAvailable || (!video.Live && !previewRequested)) return;\n        previewPolling = true;\n        string session = previewSession;\n        try {\n            var jpeg = await Task.Run(() => Api.Read(\"/preview.jpg\", 2 * 1024 * 1024));\n            if (closing || viewPaused || session != previewSession) return;\n            previewRequested = false;\n            if (!SameImage(lastPreview, jpeg)) {\n                video.SetFrame(jpeg);\n                lastPreview = jpeg;\n                displayed++;\n                previewFreshness.Restart();\n                video.PreviewStale = false;\n            } else if (video.Live && previewFreshness.Elapsed.TotalSeconds >= 5) {\n                // Identical bytes can also occur for a stationary view. Phrase this as\n                // a display warning, never as a device fault or stopped detection.\n                video.PreviewStale = true;\n                video.Invalidate();\n            }\n            if (displayClock.Elapsed.TotalSeconds >= 2) {\n                displayRate.Text = \"画面更新 / 秒  \" + (video.Live ? (displayed / displayClock.Elapsed.TotalSeconds).ToString(\"F1\") : \"回看\");\n                displayed = 0;\n                displayClock.Restart();\n            }\n        } catch {\n            // State polling owns connection/fault status. Retain the last image.\n            if (!closing) {\n                displayRate.Text = \"画面待恢复\";\n                if (previewFreshness.Elapsed.TotalSeconds >= 2) {\n                    video.PreviewStale = true;\n                    video.Invalidate();\n                }\n            }\n        } finally {\n            previewPolling = false;\n        }\n    }\n    // 根据live和phase区分实时状态与上次记录。\n    // live由板端boot/时间戳共同判定；停止后仍可展示末帧，但告警必须标明“上次记录”。\n    // 读取PL状态位0为alarm、位1为fault，不能把LED灭直接等同于输入正常。\n    void UpdateState(Dictionary\u003cstring, object> x) {\n        string p = J.S(J.G(x, \"phase\"));\n        bool live = J.B(J.G(x, \"live\"));\n        var s = J.D(J.G(x, \"state\"));\n        connection.Text = \"●  板端已连接\";\n        connection.ForeColor = Theme.Green;\n        phase.Text = Phase(p);\n        phase.ForeColor =\n            live ? Theme.Green\n                 : ((p == \"FAILED\" || p == \"UNKNOWN_RETAINED\") ? Theme.Red : Theme.Ink);\n        string why = J.S(J.G(J.G(x, \"app\"), \"reason\"));\n        if (why.Length == 0)\n            why = J.S(J.G(s, \"reason\"));\n        reason.Text = why.Length > 0 ? why\n                                     : (live ? \"板端独立检测与告警\\n关闭窗口不影响设备运行。\"\n                                             : \"最后画面保留；请根据状态处理。 \");\n        long count = J.N(J.G(s, \"frames\"));\n        double seconds = J.F(J.G(s, \"elapsed_s\"));\n        frames.Text = count.ToString(\"N0\");\n        double processing = J.G(s, \"processing_fps\") == null ? (seconds > 0 ? count / seconds : 0) : J.F(J.G(s, \"processing_fps\"));\n        fps.Text = processing > 0 ? processing.ToString(\"F2\") : \"—\";\n        var pl = J.D(J.G(s, \"PL\"));\n        if (pl.Count == 0)\n            pl = J.D(J.G(J.G(s, \"result\"), \"final_PL\"));\n        bool has = J.G(pl, \"32\") != null;\n        long bits = J.N(J.G(pl, \"32\"));\n        alarm.Text =\n            !has ? \"未知\" : ((bits & 1) != 0 ? \"告警置位\" : \"未告警\") + (live ? \"\" : \" · 上次记录\");\n        alarm.ForeColor = !has ? Theme.Muted : ((bits & 1) != 0 ? Theme.Red : Theme.Green);\n        fault.Text =\n            !has ? \"未知\" : ((bits & 2) != 0 ? \"输入超时\" : \"正常\") + (live ? \"\" : \" · 上次记录\");\n        fault.ForeColor = has && (bits & 2) == 0 ? Theme.Green : Theme.Red;\n        duration.Text = String.Format(\"{0:00}:{1:00}:{2:00}\", (int)seconds / 3600,\n                                      ((int)seconds / 60) % 60, (int)seconds % 60);\n        commits.Text = J.N(J.G(s, \"commits\")).ToString(\"N0\");\n        age.Text = J.G(x, \"state_age_s\") == null\n                       ? \"旧启动记录\"\n                       : J.F(J.G(x, \"state_age_s\")).ToString(\"F1\") + \" 秒\";\n        video.Live = live;\n        video.Message = Phase(p) + \"\\n所见画面仅供回看\";\n        video.Invalidate();\n    }\n    // 仅发认证请求，超时不能当作板端已停止。\n    // 同一时刻仅一个控制请求，等待时禁用启停按钮；响应成功后仍刷新实际板端阶段。\n    async Task Control(string action) {\n        if (commanding)\n            return;\n        if (!File.Exists(J.S(J.G(Api.Config, \"key_file\")))) {\n            using (var d = new Settings()) d.ShowDialog(this);\n            if (!File.Exists(J.S(J.G(Api.Config, \"key_file\")))) {\n                notice.Text = \"画面可只读查看；认证启停需要先配置本机已授权SSH密钥。\";\n                return;\n            }\n        }\n        commanding = true;\n        start.Enabled = stop.Enabled = false;\n        notice.Text = action == \"start\" ? \"正在认证发送启动请求…\"\n                                        : \"正在请求正常停止；等待当前推理完成和SDK关闭…\";\n        try {\n            await Task.Run(() => Api.Control(action));\n            notice.Text = action == \"start\" ? \"已发送认证启动请求，等待板端状态更新。\"\n                                            : \"正常停止请求已发送；请等待“已停止”。\";\n            await Poll();\n        } catch (Exception e) {\n            notice.Text = e.Message;\n            MessageBox.Show(this, e.Message, \"控制请求未完成\", MessageBoxButtons.OK,\n                            MessageBoxIcon.Information);\n        } finally {\n            commanding = false;\n            start.Enabled = stop.Enabled = true;\n        }\n    }\n    // 导出近期记录到所选ZIP，不写板端状态。\n    // 文件对话框在UI线程，网络写盘在Task.Run中；结束后恢复按钮并给出本地结果。\n    async Task Export() {\n        using (var dialog = new SaveFileDialog() {\n            Title = \"导出板端当前会话记录\", Filter = \"ZIP记录包|*.zip\",\n            FileName = \"无人机检测记录_\" + DateTime.Now.ToString(\"yyyyMMdd_HHmmss\") + \".zip\"\n        }) {\n            if (dialog.ShowDialog(this) != DialogResult.OK)\n                return;\n            export.Enabled = false;\n            notice.Text = \"正在导出当前记录…\";\n            try {\n                await Task.Run(() => Api.Export(dialog.FileName));\n                notice.Text = \"记录已导出：\" + dialog.FileName;\n            } catch (Exception e) {\n                notice.Text = \"导出失败：\" + e.Message;\n            } finally {\n                export.Enabled = true;\n            }\n        }\n    }\n    // 只显示当前滚动CSV的最近100行；它不是系统全部生命周期的告警总表。\n    async Task LoadEvents() {\n        try {\n            string csv = await Task.Run(\n                () => Encoding.UTF8.GetString(Api.Read(\"/events.csv\", 5 * 1024 * 1024)));\n            string[] lines = csv.Split(new[] { '\\n' }, StringSplitOptions.RemoveEmptyEntries);\n            eventGrid.Rows.Clear();\n            for (int i = Math.Max(1, lines.Length - 100); i \u003c lines.Length; i++) {\n                var cells = lines[i].Trim().Split(',');\n                if (cells.Length \u003c 5)\n                    continue;\n                int bits;\n                int.TryParse(cells[2], out bits);\n                string evt =\n                    (bits & 1) != 0\n                        ? \"告警置位\"\n                        : ((bits & 2) != 0\n                               ? \"告警解除\"\n                               : ((bits & 4) != 0 ? \"输入故障\"\n                                                  : ((bits & 8) != 0 ? \"输入恢复\" : \"状态事件\")));\n                eventGrid.Rows.Add(cells[0], cells[1], evt,\n                                   cells[3].ToLower() == \"true\" ? \"置位\" : \"未置位\");\n            }\n            recordInfo.Text =\n                \"显示当前滚动CSV中的最新 \" + eventGrid.Rows.Count + \" 条；它不是完整生命周期记录。\";\n        } catch (Exception e) {\n            recordInfo.Text = \"记录暂不可用：\" + e.Message;\n        }\n    }\n}\nstatic class Program {\n    [STAThread]\n    // 程序入口使用STA承载WinForms；--self-test只检查本机文件，不连接或启动板端。\n    static void Main(string[] args) {\n        try {\n            string data = Path.Combine(\n                Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),\n                \"UAVDetectionSystem\", \"v2\");\n            for (int i = 0; i + 1 \u003c args.Length; i++)\n                if (args[i] == \"--data-dir\")\n                    data = Path.GetFullPath(args[i + 1]);\n            Api.Initialize(data);\n            if (Array.IndexOf(args, \"--self-test\") >= 0) {\n                string agent = Path.Combine(Api.Root, @\"engine\\UAVControlAgent.exe\");\n                File.WriteAllText(\n                    Path.Combine(data, \"SELF_TEST.json\"),\n                    J.Encode(new { ok = File.Exists(agent), app = \"无人机检测系统\", native = true,\n                                   html = false, python_required = false,\n                                   system_ssh_required = false, root = Api.Root }),\n                    Encoding.UTF8);\n                return;\n            }\n            Application.EnableVisualStyles();\n            Application.SetCompatibleTextRenderingDefault(false);\n            Application.Run(new MainForm());\n        } catch (Exception e) {\n            MessageBox.Show(\"程序未能启动：\" + e.Message, \"无人机检测系统\", MessageBoxButtons.OK,\n                            MessageBoxIcon.Error);\n        }\n    }\n}\n}\n\n", "sha256": "d46500d65842a82f4f401baf8c00551c438ef6a2f00cb0fafd51347a6610ee43", "functions": [{"name": "N", "line": 32, "end": 67}, {"name": "F", "line": 33, "end": 68}, {"name": "B", "line": 34, "end": 69}, {"name": "SetFrame", "line": 155, "end": 190}, {"name": "Initialize", "line": 223, "end": 258}, {"name": "Save", "line": 261, "end": 296}, {"name": "Export", "line": 309, "end": 344}, {"name": "Build", "line": 473, "end": 508}, {"name": "SetNavigation", "line": 650, "end": 685}, {"name": "TogglePreview", "line": 660, "end": 695}, {"name": "SavePreview", "line": 679, "end": 714}, {"name": "WritePreview", "line": 700, "end": 735}, {"name": "Divider", "line": 704, "end": 739}, {"name": "SameImage", "line": 793, "end": 828}, {"name": "UpdateState", "line": 841, "end": 876}, {"name": "Main", "line": 967, "end": 996}]}, {"group": "离线数据与模型", "path": "reference/model11_training/data_role_guard.py", "name": "data_role_guard.py", "desc": "核对样本用途、来源分组与清单。", "content": "\"\"\"核对样本角色、来源分组和训练清单。\"\"\"\n\nfrom common import *\n\n\n# 核对来源归档和已接纳的训练样本。\ndef assert_fred_source_boundary(row, admission):\n    \"\"\"Canonical source identifiers survive local renaming; TRAIN-only admission.\"\"\"\n    hold_path = W / \"FRED_SOURCE_TRAINING_HOLD.json\"\n    if hold_path.exists():\n        assert not read(hold_path).get(\n            \"blocked\", True\n        ), \"FRED source use held pending annotation/visible-size contract review\"\n    assert (\n        row[\"role\"] == \"TRAIN\" and row.get(\"source_split\") == \"train\"\n    ), \"FRED admission is TRAIN only\"\n    reservation_path = Path(admission[\"source_reservation_path\"])\n    assert (\n        sha(reservation_path) == admission[\"source_reservation_SHA256\"]\n    ), \"FRED reservation changed\"\n    reservation = read(reservation_path)\n    assert (\n        reservation[\"source_id\"] == row[\"source_id\"]\n        and reservation[\"official_TEST_role\"] == \"RESERVED_NO_MEDIA_NO_PROBE\"\n    )\n    train_path = Path(admission[\"official_TRAIN_tree_path\"])\n    assert (\n        sha(train_path) == admission[\"official_TRAIN_tree_SHA256\"]\n    ), \"FRED officialTRAIN roster changed\"\n    official_train = {r[\"path\"] for r in read(train_path)}\n    official_reserved = {r[\"path\"] for r in reservation[\"official_TEST_files\"]}\n    archive = row.get(\"canonical_archive\")\n    assert (\n        archive in official_train\n        and archive not in official_reserved\n        and archive in admission[\"allowed_archives\"]\n    ), \"FRED non-TRAIN/archive alias forbidden\"\n    assert (\n        row.get(\"source_revision\") == admission[\"source_revision\"] == reservation[\"dataset_commit\"]\n    ), \"FRED source revision mismatch\"\n    fields = [\n        \"image_SHA256\",\n        \"label_SHA256\",\n        \"canonical_archive\",\n        \"original_frame_member\",\n        \"original_frame_SHA256\",\n        \"original_label_SHA256\",\n    ]\n    key = tuple(row.get(k) for k in fields)\n    assert key in {\n        tuple(r[k] for k in fields) for r in admission[\"approved_records\"]\n    }, \"FRED frame/label not in frozen admission\"\n\n\n# 核对样本角色、来源组与计划中的清单。\ndef assert_development_manifest(manifest_path, plan=None):\n    registry_path = W / \"DATA_ROLE_REGISTRY.json\"\n    registry = read(registry_path)\n    assert (\n        sha(registry[\"reservation\"]) == registry[\"reservation_SHA256\"]\n    ), \"Holdout reservation changed\"\n    additional = {}\n    for reservation_entry in registry.get(\"additional_reservations\", []):\n        assert (\n            sha(reservation_entry[\"path\"]) == reservation_entry[\"SHA256\"]\n        ), \"Additional source reservation changed\"\n        source_reservation = read(reservation_entry[\"path\"])\n        additional[source_reservation[\"source_id\"]] = source_reservation\n    if plan is not None:\n        assert plan.get(\"data_role_registry_SHA256\") == sha(\n            registry_path\n        ), \"New plan must freeze data-role registry SHA\"\n        assert plan[\"code_SHA256\"].get(str(W / \"data_role_guard.py\")) == sha(\n            __file__\n        ), \"Freeze role-guard code in new plan\"\n    approved = {\n        (r[\"image_SHA256\"], r[\"label_SHA256\"], r[\"role\"])\n        for r in registry[\"approved_existing_records\"]\n    }\n    old_images = {r[\"image_SHA256\"] for r in registry[\"approved_existing_records\"]}\n    records = read(manifest_path)[\"records\"]\n    for row in records:\n        assert row[\"role\"] in (\"TRAIN\", \"DEV\"), \"Final/unknown data forbidden in development\"\n        serialized = json.dumps(row, ensure_ascii=False).lower().replace(\"\\\\\", \"/\")\n        assert not any(\n            token in serialized for token in registry[\"protected_tokens\"]\n        ), \"Reserved final source forbidden in development\"\n        if row.get(\"source_id\") in additional:\n            source_reservation = additional[row[\"source_id\"]]\n            assert (\n                source_reservation.get(\"role\") != \"FINAL_RESERVED_NO_MEDIA\"\n            ), \"Entire source reserved for final validation\"\n            if row[\"source_id\"] == \"VisioDECT_author_8335400\":\n                member = row.get(\"canonical_member\", \"\").replace(\"\\\\\", \"/\")\n                parts = member.split(\"/\")\n                assert (\n                    len(parts) >= 4 and parts[0] == \"VisioDECT Dataset Upload\"\n                ), \"Missing canonical VisioDECT identity\"\n                assert (\n                    source_reservation[\"group_roles\"].get(parts[1]) == \"TRAIN_CANDIDATE\"\n                    and row[\"role\"] == \"TRAIN\"\n                ), \"VisioDECT reserved group forbidden\"\n                assert (\n                    row.get(\"source_version\") == source_reservation[\"version\"]\n                ), \"VisioDECT version mismatch\"\n        key = (row.get(\"image_SHA256\"), row.get(\"label_SHA256\"), row[\"role\"])\n        if key not in approved:\n            assert (\n                row.get(\"image_SHA256\") not in old_images\n            ), \"Existing role or label change requires a new audited admission, not silent reuse\"\n            assert all(\n                row.get(field) for field in (\"source_id\", \"capture_group\", \"provenance_document\")\n            ), \"New data needs explicit source/group/provenance\"\n            provenance = Path(row[\"provenance_document\"])\n            assert provenance.is_file() and row.get(\"provenance_SHA256\") == sha(\n                provenance\n            ), \"Freeze source admission document\"\n            admission = read(provenance)\n            assert (\n                admission.get(\"approved_for_development\") is True\n                and admission.get(\"source_id\") == row[\"source_id\"]\n            ), \"Missing source admission\"\n            assert not any(\n                t in json.dumps(admission, ensure_ascii=False).lower()\n                for t in registry[\"protected_tokens\"]\n            ), \"Reserved family in provenance\"\n            if row[\"source_id\"] == \"Florence_FRED_author_2025\":\n                assert_fred_source_boundary(row, admission)\n            if row[\"source_id\"] == \"VisioDECT_author_8335400\":\n                assert (\n                    row[\"role\"] == admission[\"allowed_role\"] == \"TRAIN\"\n                ), \"VisioDECT admission TRAIN only\"\n                assert (\n                    sha(admission[\"reservation_path\"]) == admission[\"reservation_SHA256\"]\n                ), \"VisioDECT reservation changed\"\n                fields = [\n                    \"image_SHA256\",\n                    \"label_SHA256\",\n                    \"canonical_member\",\n                    \"original_frame_SHA256\",\n                    \"original_label_SHA256\",\n                    \"source_version\",\n                ]\n                assert tuple(row.get(k) for k in fields) in {\n                    tuple(r[k] for k in fields) for r in admission[\"approved_records\"]\n                }, \"VisioDECT member/label not in frozen admission\"\n    return dict(\n        records=len(records), registry_SHA256=sha(registry_path), reserved_final_source_used=False\n    )\n", "sha256": "50b6862df87a980e56fcf2d19309c604efebb437386c0eee90a98224278ab560", "functions": [{"name": "assert_fred_source_boundary", "line": 7, "end": 52}, {"name": "assert_development_manifest", "line": 56, "end": 149}]}, {"group": "离线数据与模型", "path": "reference/model11_training/scoring.py", "name": "scoring.py", "desc": "按IoU匹配输出框与标注，统计P、R和F1。", "content": "\"\"\"按IoU匹配检测框与标注，统计精确率、召回率和F1。\"\"\"\n\nimport math\n\n\n# 计算两个xyxy框的交并比。\ndef iou(a, b):\n    intersection = max(0.0, min(a[2], b[2]) - max(a[0], b[0])) * max(\n        0.0, min(a[3], b[3]) - max(a[1], b[1])\n    )\n    area_a = max(0.0, a[2] - a[0]) * max(0.0, a[3] - a[1])\n    area_b = max(0.0, b[2] - b[0]) * max(0.0, b[3] - b[1])\n    union = area_a + area_b - intersection\n    return intersection / union if union else 0.0\n\n\n# 由TP、FP、FN计算精确率、召回率和F1。\ndef rates(tp, fp, fn):\n    return dict(\n        TP=tp,\n        FP=fp,\n        FN=fn,\n        P=tp / (tp + fp) if tp + fp else None,\n        R=tp / (tp + fn) if tp + fn else None,\n        F1=2 * tp / (2 * tp + fp + fn) if 2 * tp + fp + fn else None,\n    )\n\n\n# 按固定IoU阈值匹配检测与标注并汇总计数。\ndef score(rows):\n    \"\"\"Rows contain already thresholded/NMS outputs; do not refilter cached data.\"\"\"\n    tp = fp = fn = known = unknown = negative = false_frames = 0\n    presence_tp = presence_fp = presence_fn = 0\n    for row in rows:\n        if not row[\"valid_truth\"]:\n            unknown += 1\n            continue\n        known += 1\n        gt, ds = row[\"truth\"], row[\"detections\"]\n        for box in gt + ds:\n            if len(box[\"xyxy\"]) != 4 or not all(math.isfinite(x) for x in box[\"xyxy\"]):\n                raise ValueError(\"Non-finite or malformed box\")\n        remaining = list(range(len(ds)))\n        hits = 0\n        for g in gt:\n            choices = [j for j in remaining if ds[j][\"class\"] == g[\"class\"]]\n            if choices:\n                j = max(choices, key=lambda j: iou(g[\"xyxy\"], ds[j][\"xyxy\"]))\n                if iou(g[\"xyxy\"], ds[j][\"xyxy\"]) >= 0.5:\n                    remaining.remove(j)\n                    hits += 1\n        tp += hits\n        fp += len(ds) - hits\n        fn += len(gt) - hits\n        negative += not gt\n        false_frames += not gt and bool(ds)\n        presence_tp += bool(gt) and bool(ds)\n        presence_fp += not gt and bool(ds)\n        presence_fn += bool(gt) and not ds\n    return dict(\n        **rates(tp, fp, fn),\n        frames=len(rows),\n        known_frames=known,\n        unknown_frames=unknown,\n        GT=tp + fn,\n        negative_frames=negative,\n        negative_false_alarm_frames=false_frames,\n        negative_false_alarm_rate=false_frames / negative if negative else None,\n        presence=rates(presence_tp, presence_fp, presence_fn)\n    )\n", "sha256": "38eb1b761514505be76650f7a2a2f148171558ba955c3ae2588526fa9b650e80", "functions": [{"name": "iou", "line": 7, "end": 14}, {"name": "rates", "line": 18, "end": 26}, {"name": "score", "line": 30, "end": 70}]}, {"group": "离线数据与模型", "path": "reference/model11_conversion/export_raw_heads_pinned.py", "name": "export_raw_heads_pinned.py", "desc": "导出三个检测头，供Icraft转换。", "content": "\"\"\"导出模型的三个检测头，供Icraft转换使用。\"\"\"\nimport argparse\nimport copy\nimport hashlib\nimport json\nimport types\nfrom pathlib import Path\n\nimport numpy as np\nimport onnx\nimport onnxruntime as ort\nimport torch\nfrom ultralytics import YOLO\n\n\ndef raw_heads(self, features):\n    outputs = []\n    for index in range(self.nl):\n        outputs.extend((self.cv3[index](features[index]), self.cv2[index](features[index])))\n    return tuple(outputs)\n\n\ndef main():\n    repo = Path(__file__).resolve().parents[2]\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\n        \"--weights\", type=Path, default=repo / \"pc_runs/m2_rgb_step5_baseline_b32/weights/best.pt\"\n    )\n    parser.add_argument(\n        \"--output\",\n        type=Path,\n        default=repo / \"pc_runs/m5_drone_yolo11_339/2_compile/fmodel/drone_yolo11n_raw_heads.onnx\",\n    )\n    parser.add_argument(\n        \"--report\", type=Path, default=repo / \"reports/drone_raw_heads_export_20261001.json\"\n    )\n    args = parser.parse_args()\n    weights, output = args.weights.resolve(), args.output.resolve()\n    output.parent.mkdir(parents=True, exist_ok=True)\n    detector = YOLO(str(weights))\n    model = copy.deepcopy(detector.model).cpu().float().eval()\n    model.fuse(verbose=False)\n    head = model.model[-1]\n    if head.nc != 1 or head.nl != 3 or head.reg_max != 16 or getattr(head, \"end2end\", False):\n        raise ValueError(\n            \"This deployment adapter expects one class, three heads, reg_max=16, non-end2end Detect\"\n        )\n    head.forward = types.MethodType(raw_heads, head)\n    torch.manual_seed(42)\n    example = torch.rand(1, 3, 640, 640)\n    names = [\"cls_s8\", \"box_s8\", \"cls_s16\", \"box_s16\", \"cls_s32\", \"box_s32\"]\n    with torch.no_grad():\n        expected = tuple(value.cpu().numpy() for value in model(example))\n        torch.onnx.export(\n            model,\n            example,\n            str(output),\n            opset_version=17,\n            dynamo=False,\n            input_names=[\"images\"],\n            output_names=names,\n            dynamic_axes=None,\n        )\n    graph = onnx.load(str(output))\n    onnx.checker.check_model(graph)\n    session = ort.InferenceSession(str(output), providers=[\"CPUExecutionProvider\"])\n    actual = session.run(None, {\"images\": example.numpy()})\n    comparisons = []\n    for name, reference, candidate in zip(names, expected, actual):\n        delta = float(np.max(np.abs(reference - candidate)))\n        np.testing.assert_allclose(candidate, reference, atol=0.001, rtol=0.001)\n        comparisons.append(\n            {\"name\": name, \"shape\": list(reference.shape), \"maximum_absolute_difference\": delta}\n        )\n    producers = {name: node.op_type for node in graph.graph.node for name in node.output}\n    if any(producers[value.name] != \"Conv\" for value in graph.graph.output):\n        raise ValueError(\n            \"DetPost export endpoints must be the raw classification/regression convolutions\"\n        )\n    report = {\n        \"weights\": str(weights),\n        \"weights_sha256\": hashlib.sha256(weights.read_bytes()).hexdigest(),\n        \"output\": str(output),\n        \"onnx_sha256\": hashlib.sha256(output.read_bytes()).hexdigest(),\n        \"torch_version\": torch.__version__,\n        \"opset\": 17,\n        \"classes\": detector.names,\n        \"outputs\": comparisons,\n        \"output_producers\": {value.name: producers[value.name] for value in graph.graph.output},\n        \"all_passed\": True,\n        \"scope\": \"Six-head numerical export check on one seeded input; full detection alignment is tested separately.\",\n    }\n    args.report.resolve().parent.mkdir(parents=True, exist_ok=True)\n    args.report.resolve().write_text(json.dumps(report, indent=2) + \"\\n\", encoding=\"utf-8\")\n    print(f\"Exported: {output}\")\n    for item in comparisons:\n        print(item)\n\n\nif __name__ == \"__main__\":\n    main()\n", "sha256": "2747e02bcd8a760231689b4dcb90b6b6653418c6459ea7bb838801ae9a69e7b4", "functions": [{"name": "raw_heads", "line": 16, "end": 20}, {"name": "main", "line": 23, "end": 97}]}]</script><script>

function jump(){const v=+$('#functions').value;const f=current.functions[v];document.querySelectorAll('.line.selected').forEach(x=>x.classList.remove('selected'));if(!f){$('#selection').textContent='显示完整源文件';return}for(let i=f.line;i<=f.end;i++)document.getElementById('L'+i)?.classList.add('selected');const line=document.getElementById('L'+Math.max(1,f.line-3));$('#code').scrollTop=line.offsetTop-$('#code').offsetTop;$('#selection').textContent=f.name+' · 第'+f.line+'—'+f.end+'行'}
function show(name,fn){current=FILES.find(f=>f.name===name)||current;list();$('#meta').innerHTML='<h2>'+esc(current.name)+'</h2><div class="path">'+esc(current.path)+'</div><p>'+esc(current.desc)+'</p>';$('#functions').innerHTML='<option value="-1">完整文件</option>'+current.functions.map((f,i)=>'<option value="'+i+'">'+esc(f.name)+' · L'+f.line+'</option>').join('');$('#code').innerHTML=current.content.split('\n').map((line,i)=>'<div id="L'+(i+1)+'" class="line '+(/^\s*(#(?!include|pragma)|\/\/|\*)/.test(line)?'comment':'')+'"><span class="num">'+(i+1)+'</span><span class="source">'+esc(line||' ')+'</span></div>').join('');$('#lineCount').textContent=current.content.split('\n').length+'行 · SHA256 '+current.sha256.slice(0,16)+'…';const data=focus[current.name]||[current.desc,['先找输入、输出及单位。','再看异常与退出条件。','最后与相关模块和测试交叉核对。'],FILES.filter(f=>f.group===current.group&&f!==current).slice(0,3).map(f=>f.name)];$('#focus').textContent=data[0];$('#questions').innerHTML=data[1].map(s=>'<li>'+esc(s)+'</li>').join('');$('#related').innerHTML=data[2].map(n=>'<button data-file="'+esc(n)+'">'+esc(n)+' →</button>').join('');$('#functions').value=fn?current.functions.findIndex(f=>f.name===fn):-1;$('#code').scrollTop=0;jump();$('#codeSearch').value='';hits=[];document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===current.name));}
document.addEventListener('click',e=>{const f=e.target.closest('[data-file]');if(f)show(f.dataset.file);const r=e.target.closest('[data-route]');if(r)show(r.dataset.route)});$('#fileSearch').addEventListener('input',list);$('#functions').addEventListener('change',jump);$('#codeSearch').addEventListener('input',()=>{const q=$('#codeSearch').value.toLowerCase();hits=[];document.querySelectorAll('.line').forEach(n=>{const on=!!q&&n.querySelector('.source').textContent.toLowerCase().includes(q);n.classList.toggle('found',on);if(on)hits.push(n)});hitAt=-1;$('#selection').textContent=q?'找到'+hits.length+'处匹配':'显示当前函数'});$('#nextHit').onclick=()=>{if(hits.length){hitAt=(hitAt+1)%hits.length;$('#code').scrollTop=hits[hitAt].offsetTop-$('#code').offsetTop-50;$('#selection').textContent='匹配 '+(hitAt+1)+' / '+hits.length}};show('worker.py','Hardware.commit');
</script></html>
