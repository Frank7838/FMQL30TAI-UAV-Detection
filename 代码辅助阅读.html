|| !height || width > 8192 || height > 8192 ||\n                uint64_t(width) * height > 8388608)\n                throw std::runtime_error(\"invalid or excessive frame size\");\n            const std::pair\u003cint, int> target{info.i_cubic[0].h, info.i_cubic[0].w};\n            const bool compact = validate_center_header(request, processed, target);\n            cv::Mat body(compact ? CENTER_SMALL_HEIGHT : int(height),\n                         compact ? CENTER_SMALL_WIDTH : int(width), CV_8UC3);\n            receive_exact(fd, body.data, body.total() * body.elemSize());\n            const auto begin = Clock::now();\n            // Vendor PicPre has no virtual destructor. Own each concrete type;\n            // never delete a derived preprocessor through a PicPre pointer.\n            // 保持具体预处理对象活到后处理结束；PicPre没有虚析构，不能经基类指针delete。\n            std::unique_ptr\u003cCenterPacketPicPre> center_owner;\n            std::unique_ptr\u003cFusedStreamPicPre> raw_owner;\n            PicPre *image_pointer = nullptr;\n            if (compact) {\n                if (show || save)\n                    throw std::logic_error(\"center worker cannot visualize original colors\");\n                center_owner = std::make_unique\u003cCenterPacketPicPre>(body, width, height, target,\n                                                                    center_storage);\n                image_pointer = center_owner.get();\n            } else {\n                raw_owner = std::make_unique\u003cFusedStreamPicPre>(body, target);\n                image_pointer = raw_owner.get();\n            }\n            PicPre &image = *image_pointer;\n            const auto picture_end = Clock::now();\n            // CPU RGB图复制一次到SDK拥有的Host Tensor，再由dmaInit交接设备。\n            // 这是减少重复复制的路径，并非相机、PL、NPU之间的零拷贝通路。\n            auto tensor = DirectUInt8Tensor(image.dst_img, network);\n            // Development adoption gate: compare actual tensor bytes against the\n            // previous helper on four real inputs, with only one NPU forward each.\n            // 前四个真实输入逐字节比对Tensor与旧预处理；每个输入只执行一次forward。\n            // 对四种输入比较新旧预处理结果。\n            if (processed \u003c 4) {\n                auto reference = CvMat2Tensor(image.dst_img, network);\n                if (!compact)\n                    compare_picture(body, target);\n                const auto bytes =\n                    reference.dtype().numElements() * reference.dtype()->element_dtype.bits() / 8;\n                require(tensor.dtype().numElements() == reference.dtype().numElements() &&\n                            tensor.dtype()->element_dtype.bits() ==\n                                reference.dtype()->element_dtype.bits(),\n                        \"Input tensor layout mismatch\");\n                require(std::memcmp(tensor.data().cptr(), reference.data().cptr(), bytes) == 0,\n                        \"Input tensor bytes mismatch\");\n                if (processed == 3)\n                    std::cout \u003c\u003c \"INPUT_TENSOR_AND_PREPROCESS_BYTES_MATCH samples=4\\n\"\n                              \u003c\u003c std::flush;\n            }\n            const auto tensor_end = Clock::now();\n            dmaInit(backend, info.ImageMake_on, tensor, device);\n            const auto pre_end = Clock::now();\n            // No business register writes in this inference-only child.\n            // 这里只提交厂商NPU；推理完成、后处理结束后才向父进程回包。\n            // 同步forward返回后才进入复位/后处理；父进程此时仍没有本帧完成回执。\n            auto outputs = session.forward({tensor});\n            const auto forward_end = Clock::now();\n            // 沿用厂商SDK的推理传输复位。业务告警的reset单独同步，不由此清除。\n            device.reset(1);\n            const auto infer_end = Clock::now();\n            std::vector\u003cstd::vector\u003cfloat>> detections;\n            if (info.DetPost_on) {\n                detections =\n                    post_detpost_hard(outputs, image, info, confidence, nms_iou, multilabel,\n                                      fpga_nms, classes, anchors, labels, show, save, result_root,\n                                      name, device, backend, norms, real_channels, strides, 64);\n            } else {\n                detections = post_detpost_soft(outputs, image, labels, anchors, info, classes,\n                                               confidence, nms_iou, fpga_nms, device, backend,\n                                               multilabel, show, save, result_root, name);\n            }\n            const auto post_end = Clock::now();\n            // 300是通信协议的最大返回框数；父进程的PL原始框容量是16，超限会显式报错而非直接截断。\n            if (detections.size() > 300)\n                throw std::runtime_error(\"Response detection limit\");\n            // 回包头12字节：[RESULT_MAGIC, 原请求序号, 框数]。\n            // 再发11个double：3段汇总耗时与8段细项；每框6个float为类别、x、y、宽、高、分数。\n            uint32_t response[3] = {RESULT_MAGIC, request[1],\n                                    static_cast\u003cuint32_t>(detections.size())};\n            const double times[11] = {\n                milliseconds(begin, pre_end),          milliseconds(pre_end, infer_end),\n                milliseconds(infer_end, post_end),     milliseconds(guard_begin, guard_end),\n                milliseconds(guard_end, begin),        milliseconds(begin, picture_end),\n                milliseconds(picture_end, tensor_end), milliseconds(tensor_end, pre_end),\n                milliseconds(pre_end, forward_end),    milliseconds(forward_end, infer_end),\n                milliseconds(infer_end, post_end)};\n            send_exact(fd, response, sizeof(response));\n            send_exact(fd, times, sizeof(times));\n            for (const auto &row : detections) {\n                if (row.size() != 6)\n                    throw std::runtime_error(\"unexpected detection row shape\");\n                send_exact(fd, row.data(), 6 * sizeof(float));\n            }\n            // Raw detections returned; parent validates and commits to M512 separately.\n            if (!processed)\n                calctime_detail(backend, session);\n            ++processed;\n        }\n        // 正常结束必须走SDK关闭；父进程确认退出码后才释放会话设备锁。\n        // 只有正常退出路径显式关闭SDK并返回0；异常路径返回1，由父进程保留未知设备所有权。\n        Device::Close(device);\n        std::cout \u003c\u003c \"NPU_STREAM_COMPLETE frames=\" \u003c\u003c processed \u003c\u003c '\\n';\n        return 0;\n    } catch (const std::exception &error) {\n        std::cerr \u003c\u003c \"NPU_STREAM_FAILED: \" \u003c\u003c error.what() \u003c\u003c '\\n';\n        return 1;\n    }\n}\n", "sha256": "05b84df7517e046f7113de1b77c741512dd7e2e041df74653a55fe1b4875e738", "functions": [{"name": "receive_exact", "line": 41, "end": 76}, {"name": "send_exact", "line": 55, "end": 90}, {"name": "milliseconds", "line": 69, "end": 104}, {"name": "compare_picture", "line": 75, "end": 110}, {"name": "main", "line": 88, "end": 123}]}, {"group": "常驻推理", "path": "src/npu/FusedStreamPicPre.hpp", "name": "FusedStreamPicPre.hpp", "desc": "CPU合并颜色转换与补边，保持模型输入约定。", "content": "// 默认相机输入的CPU预处理。640×480到640×640采用右/下填充114。\n// 同尺寸区域直接BGR转RGB，NEON批量处理并补尾像素，避免中间复制。\n\n#pragma once\n#include \u003calgorithm>\n#include \u003carm_neon.h>\n#include \u003ccmath>\n#include \u003cstdexcept>\n#include \u003ctuple>\n#include \"PicPre.hpp\"\n\n// For the stream worker only: BGR UINT8, LONG_SIDE, right/bottom 114 padding.\n// The caller retains bgr until postprocessing finishes. Visualization is disabled.\nclass FusedStreamPicPre final : public PicPre {\n  public:\n    bool fast_path = false;\n    // target顺序为(height,width)。src/ori_img只共享只读原图，坐标回映射仍使用原几何。\n    FusedStreamPicPre(const cv::Mat &bgr, std::pair\u003cint, int> target) {\n        if (bgr.empty() || bgr.type() != CV_8UC3 || target.first \u003c= 0 || target.second \u003c= 0)\n            throw std::invalid_argument(\"StreamPicPre requires BGR UINT8 and positive target\");\n        src_dims = {3, bgr.rows, bgr.cols};\n        ori_img = bgr; // Read-only shared ownership; no full-resolution clone.\n        src_img =\n            bgr; // coordTrans reads cols/rows. No base Resize or source-color consumer is used.\n        _dst_shape = target;\n        const float ratio_h = float(target.first) / float(bgr.rows);\n        const float ratio_w = float(target.second) / float(bgr.cols);\n        const float ratio = std::min(ratio_w, ratio_h);\n        const int h = int(std::round(bgr.rows * ratio));\n        const int w = int(std::round(bgr.cols * ratio));\n        if (!h || !w)\n            throw std::invalid_argument(\"Rounded resize dimension is zero\");\n        _real_resized_ratio = {ratio, ratio};\n        _real_resized_hw = {h, w};\n        // 当前640×480输入无需缩放：先初始化640×640为114，再直接在有效区域写RGB。\n        // 有效内容左上对齐，右侧和下方填充114。\n        if (w == bgr.cols && h == bgr.rows) {\n            // No resize is needed. Write RGB straight into the final padded\n            // image, avoiding resize-copy, temporary RGB and border-copy.\n            dst_img = cv::Mat(target.first, target.second, CV_8UC3, cv::Scalar(114, 114, 114));\n            for (int y = 0; y \u003c h; ++y) {\n                const auto *source = bgr.ptr\u003cunsigned char>(y);\n                auto *destination = dst_img.ptr\u003cunsigned char>(y);\n                int x = 0;\n                // NEON一次解交织16个BGR像素并交换R/B；每行使用Mat::ptr，保留真实stride。\n                for (; x + 16 \u003c= w; x += 16) {\n                    auto pixels = vld3q_u8(source + 3 * x);\n                    auto first = pixels.val[0];\n                    pixels.val[0] = pixels.val[2];\n                    pixels.val[2] = first;\n                    vst3q_u8(destination + 3 * x, pixels);\n                }\n                // 不足16个像素的尾部使用标量，不能越过行尾读取。\n                for (; x \u003c w; ++x) {\n                    destination[3 * x] = source[3 * x + 2];\n                    destination[3 * x + 1] = source[3 * x + 1];\n                    destination[3 * x + 2] = source[3 * x];\n                }\n            }\n            _pad_info = {0, 0};\n            fast_path = true;\n        // 精确3:1缩放时，INTER_LINEAR落在(3x+1,3y+1)的整像素中心，可直接采样等价中心。\n        } else if (bgr.cols == 3 * w && bgr.rows == 3 * h) {\n            // INTER_LINEAR at exact scale 3 samples (3*x+1, 3*y+1).\n            // Preserve all source pixels outside these centers and the source lifetime.\n            dst_img = cv::Mat(target.first, target.second, CV_8UC3, cv::Scalar(114, 114, 114));\n            for (int y = 0; y \u003c h; ++y) {\n                const auto *source = bgr.ptr\u003cunsigned char>(3 * y + 1);\n                auto *destination = dst_img.ptr\u003cunsigned char>(y);\n                for (int x = 0; x \u003c w; ++x) {\n                    const int input = 9 * x + 3;\n                    const int output = 3 * x;\n                    destination[output] = source[input + 2];\n                    destination[output + 1] = source[input + 1];\n                    destination[output + 2] = source[input];\n                }\n            }\n            _pad_info = {0, 0};\n            fast_path = true;\n        } else {\n            // 其他比例回退OpenCV线性缩放及原PicPre补边，保持旧输入合同而非近似替换。\n            cv::Mat small_bgr;\n            cv::resize(bgr, small_bgr, cv::Size(w, h), 0, 0, cv::INTER_LINEAR);\n            cv::cvtColor(small_bgr, dst_img, cv::COLOR_BGR2RGB);\n            rPad(PicPre::BR);\n        }\n    }\n};\n", "sha256": "51c2c72768b9feebd6cce843224f9ff32d3a3c046ff9e19afdf9c9caad472633", "functions": []}, {"group": "常驻推理", "path": "src/npu/DirectTensor.hpp", "name": "DirectTensor.hpp", "desc": "分配并填充与Icraft约定一致的输入张量。", "content": "// 直接分配UINT8 Tensor并拷贝预处理结果，保持Icraft输入布局与类型。\n\n#pragma once\n// For true UInt8 RGB only, convertTo(CV_8U) is an identical byte copy.\n// Copy once into a fresh SDK-owned Host allocation. No Tensor shares mutable\n// RGB storage; non-UInt8/non-fixed/non-contiguous inputs use vendor helper.\n// 只对固定640×640连续RGB/UInt8走直接分配路径；不满足类型或布局时回退厂商转换。\n// 返回Tensor拥有独立Host存储；图像缓冲下一次复用不会改写已提交输入。\ninline icraft::xrt::Tensor DirectUInt8Tensor(cv::Mat &image, const icraft::xrt::Network &network) {\n    auto dtype = network.inputs()[0].tensorType().clone();\n    auto storage = dtype->element_dtype.getStorageType();\n    if (image.type() != CV_8UC3 || image.rows != 640 || image.cols != 640 ||\n        !image.isContinuous() || !storage.is\u003cicraft::xir::IntegerType>() ||\n        !storage.cast\u003cicraft::xir::IntegerType>().isUInt8() || dtype->element_dtype.bits() != 8)\n        return CvMat2Tensor(image, network);\n    // 显式保持NHWC：[batch=1,height=640,width=640,channels=3]，不额外除255或改量化类型。\n    dtype.setShape(std::vector\u003cint64_t>{1, 640, 640, 3});\n    auto tensor = icraft::xrt::Tensor(dtype).mallocOn(icraft::xrt::HostDevice::MemRegion());\n    if (tensor.data().cptr() == nullptr || tensor.dtype().numElements() != 640 * 640 * 3 ||\n        image.total() * image.elemSize() != 640 * 640 * 3)\n        throw std::runtime_error(\"direct UInt8 real buffer contract\");\n    std::memcpy(tensor.data().cptr(), image.data, 640 * 640 * 3);\n    return tensor;\n}\n", "sha256": "8ef465f43e6b4f3e7e894ced53866201d8a006d39c736799ded5d607d7ecfecf", "functions": []}, {"group": "硬件告警", "path": "src/board/native/mmio.c", "name": "mmio.c", "desc": "CPU到业务寄存器的C接口，供Python提交与读取状态。", "content": "// CPU到PL业务寄存器的C ABI，映射0x400C0000。只接受继承的真实独占锁。\n// switch_snapshot保留7次有序读取及每次屏障，合并调用不能保证硬件原子快照。\n\n#include \u003cstdint.h>\n#include \u003csys/mman.h>\n#include \u003csys/file.h>\n#include \u003csys/stat.h>\n#include \u003cfcntl.h>\n#include \u003cunistd.h>\n#include \u003cerrno.h>\nstatic int memfd = -1, held = -1;\nstatic volatile uint32_t *regs;\n// ARM外设访问使用dmb osh，编译器memory约束也保留；volatile本身不保证完整访问顺序。\nstatic void barrier(void) { __asm__ __volatile__(\"dmb osh\" ::: \"memory\"); }\n// 只解除映射并关闭本库打开的/dev/mem；继承的设备锁fd仍由Python会话持有和关闭。\nint switch_close(void) {\n    if (regs) {\n        munmap((void *)regs, 4096);\n        regs = 0;\n    }\n    if (memfd >= 0) {\n        close(memfd);\n        memfd = -1;\n    }\n    held = -1;\n    return 0;\n}\n// 验证继承fd仍指向同一个锁文件；不能通过删除重建锁绕过设备所有者。\nstatic int valid(void) {\n    struct stat a, b;\n    return held >= 0 && fstat(held, &a) == 0 &&\n           stat(\"/root/fpga_gaming/ps_session_m53.lock\", &b) == 0 && a.st_ino == 943514 &&\n           a.st_ino == b.st_ino && a.st_dev == b.st_dev && flock(held, LOCK_EX | LOCK_NB) == 0;\n}\n// 映射业务窗口并读签名0xA5050001；不打开NPU SDK或启动DMA。\nint switch_open(int inherited) {\n    if (regs)\n        return -EBUSY;\n    held = inherited;\n    if (!valid())\n        return -EBUSY;\n    memfd = open(\"/dev/mem\", O_RDWR | O_SYNC);\n    if (memfd \u003c 0)\n        return -errno;\n    void *p = mmap(0, 4096, PROT_READ | PROT_WRITE, MAP_SHARED, memfd, 0x400C0000ULL);\n    if (p == MAP_FAILED) {\n        switch_close();\n        return -ENOMEM;\n    }\n    regs = p;\n    barrier();\n    if (regs[0xC0 / 4] != 0xA5050001) {\n        switch_close();\n        return -EPROTO;\n    }\n    return 0;\n}\n// offset是字节偏移，必须4字节对齐且在4KiB内；负返回值表示失败，不能当正常寄存器值。\nint switch_read(uint32_t offset, uint32_t *out) {\n    if (!regs || !out || offset >= 4096 || (offset & 3) || !valid())\n        return -EINVAL;\n    barrier();\n    *out = regs[offset / 4];\n    barrier();\n    return 0;\n}\n// 写白名单仅覆盖业务寄存器；Python产品层进一步禁止业务复位0x00。\n// C接口包含业务复位地址；日常Python接口仅写帧事务和事件清除。\nint switch_write(uint32_t offset, uint32_t value) {\n    if (!regs || !(offset \u003c= 0x10 || offset == 0x38) || (offset & 3) || !valid())\n        return -EINVAL;\n    barrier();\n    if (regs[0xC0 / 4] != 0xA5050001)\n        return -EPROTO;\n    regs[offset / 4] = value;\n    barrier();\n    return 0;\n}\n\n// Ordered read group, not an atomic hardware snapshot. No business writes.\n// The same inherited exclusive owner is checked at both boundaries. Keep\n// every per-register MMIO barrier and publish nothing if ownership fails.\n// 七项顺序为签名、状态、末帧、accept、reject、protocol_error、event。\n// 逐项有屏障且末尾复查所有权；这只是有序读取组，不保证同一硬件周期的原子性。\nint switch_snapshot(uint32_t *out) {\n    static const uint32_t offsets[7] = {0xC0, 0x20, 0x24, 0x28, 0x2C, 0x30, 0x34};\n    uint32_t values[7];\n    if (!regs || !out || !valid())\n        return -EINVAL;\n    for (unsigned i = 0; i \u003c 7; i++) {\n        barrier();\n        values[i] = regs[offsets[i] / 4];\n        barrier();\n    }\n    if (!valid())\n        return -EBUSY;\n    for (unsigned i = 0; i \u003c 7; i++)\n        out[i] = values[i];\n    return 0;\n}\n", "sha256": "e682e66232de2196e46ce66df2b88fc9baa438776e0842e85b02fb3914394ebb", "functions": [{"name": "barrier", "line": 14, "end": 49}, {"name": "switch_close", "line": 16, "end": 51}, {"name": "valid", "line": 29, "end": 64}, {"name": "switch_open", "line": 36, "end": 71}, {"name": "switch_read", "line": 59, "end": 94}, {"name": "switch_write", "line": 69, "end": 100}, {"name": "switch_snapshot", "line": 85, "end": 100}]}, {"group": "硬件告警", "path": "src/pl/alarm/region_alarm_regs_m505.v", "name": "region_alarm_regs_m505.v", "desc": "接收一帧框坐标，核对事务并判断ROI。", "content": "// 已上板事务寄存器层，厂商地址/数据合并写握手，不是完整AXI4-Lite。\n// BEGIN→最多16对坐标→COMMIT组成一次推理结果，半开ROI使用Q16框中心。\n// 关键修复：故障入口或半事务超时使事务失效，旧COMMIT不能解除fault。\n\n// Native vendor merged write and separate read handshake, not AXI4-Lite.\n// Coordinates normalized to 0..65535; PL evaluates box center in half-open ROI.\nmodule region_alarm_regs_m505\n    #(parameter integer TIMEOUT_MS = 1000,\n      parameter [15 : 0] ROI_X0 = 8192, ROI_X1 = 57344, ROI_Y0 = 4096, ROI_Y1 = 57344)\n    (input wire clk, reset, tick_ms, bus_reset,\n     input wire [31 : 0] awaddr, awdata, araddr,\n     input wire awvalid, arvalid, rready,\n     output wire awready, arready,\n     output reg [31 : 0] rdata,\n     output reg rvalid,\n     output wire alarm, fault);\n    // 寄存器偏移以字节计：\n    // 0x00业务软复位(产品禁写)，0x04 BEGIN(frame_id)，0x08 XY0，0x0C XY1，0x10 COMMIT。\n    // 0x20状态，0x24末帧，0x28接受数，0x2C拒绝数，0x30协议错，0x34事件，0x38事件W1C。\n    // 0xC0返回签名0xA5050001。地址译码取[17:2]，不要把case常量误当成字节偏移。\n    // txn表示事务已打开，have_xy表示只收到第一半坐标，bad在当前事务内保持错误。\n    reg pending, txn, bad, have_xy;\n    reg [31 : 0] shadow_frame, xy;\n    reg [4 : 0] boxes;\n    reg hit;\n    // The inference result is a transaction, not just a fresh-looking frame ID.\n    // An open transaction cannot survive a stream fault or remain half-written\n    // indefinitely while fault is already set. Business alarm/counters persist.\n    reg fault_seen;\n    reg [15 : 0] txn_age_ms;\n    // 同时覆盖故障前已开事务，以及故障已置位后新开但未完成的事务。\n    wire fault_entry = fault && !fault_seen;\n    wire txn_expired = txn && tick_ms && txn_age_ms == TIMEOUT_MS - 1;\n    wire abort_txn = fault_entry || txn_expired;\n    reg pulse, pulse_fresh, pulse_hit, soft_reset;\n    reg [31 : 0] pulse_frame, protocol_errors, event_latch;\n    wire have_frame;\n    wire [3 : 0] positives, empties, events;\n    wire [31 : 0] last_frame, accepts, rejects;\n    // 记录告警、断流与恢复发生时的周期数和帧号；不参与告警判断。\n    wire [63 : 0] obs_cycles, obs_assert, obs_clear, obs_fault, obs_recover;\n    wire [31 : 0] obs_seq, obs_assert_frame, obs_clear_frame, obs_fault_frame, obs_recover_frame;\n    wire [3 : 0] obs_valid, obs_last_mask;\n    alarm_observer observer(.clk(clk),\n                            .reset(reset),\n                            .events(events),\n                            .event_frame(last_frame),\n                            .cycles(obs_cycles),\n                            .event_seq(obs_seq),\n                            .valid_mask(obs_valid),\n                            .last_mask(obs_last_mask),\n                            .assert_cycles(obs_assert),\n                            .clear_cycles(obs_clear),\n                            .fault_cycles(obs_fault),\n                            .recover_cycles(obs_recover),\n                            .assert_frame(obs_assert_frame),\n                            .clear_frame(obs_clear_frame),\n                            .fault_frame(obs_fault_frame),\n                            .recover_frame(obs_recover_frame));\n    wire [15 : 0] x0 = xy[15 : 0], y0 = xy[31 : 16], x1 = awdata[15 : 0], y1 = awdata[31 : 16];\n    // 坐标端点先扩到17位相加，避免16位溢出；直接比较2×ROI边界，不除法截断中心。\n    wire [16 : 0] sum_x = {1'b0, x0} + {1'b0, x1}, sum_y = {1'b0, y0} + {1'b0, y1};\n    wire valid_box = x0 \u003c x1 && y0 \u003c y1;\n    wire roi_match = valid_box && sum_x >= {ROI_X0, 1'b0} && sum_x \u003c {ROI_X1, 1'b0} &&\n                     sum_y >= {ROI_Y0, 1'b0} && sum_y \u003c {ROI_Y1, 1'b0};\n    // 超时边界不接受新写，并屏蔽尚未提交的pulse，防止旧事务穿透。\n    // awvalid/awready是厂商合并地址与数据握手，不能按标准AXI-Lite分离AW/W通道使用。\n    // pending让刚发出的COMMIT脉冲留出消费周期；复位或事务过期边界不接受写。\n    assign awready = !reset && !bus_reset && !pending && !soft_reset && !abort_txn;\n    assign arready = !reset && !bus_reset && !soft_reset && (!rvalid || rready);\n    region_alarm_core #(.TIMEOUT_MS(TIMEOUT_MS))\n        core(.clk(clk),\n             .reset(reset | soft_reset),\n             .tick_ms(tick_ms),\n             .commit(pulse && !bus_reset && !abort_txn),\n             .fresh(pulse_fresh),\n             .region_hit(pulse_hit),\n             .frame_id(pulse_frame),\n             .alarm(alarm),\n             .fault(fault),\n             .have_frame(have_frame),\n             .positive_run(positives),\n             .empty_run(empties),\n             .last_frame(last_frame),\n             .accepted_count(accepts),\n             .rejected_count(rejects),\n             .events(events));\n    always @(posedge clk) begin\n        if (reset || soft_reset) begin\n            pending \u003c= 0;\n            txn \u003c= 0;\n            bad \u003c= 0;\n            have_xy \u003c= 0;\n            shadow_frame \u003c= 0;\n            xy \u003c= 0;\n            boxes \u003c= 0;\n            hit \u003c= 0;\n            pulse \u003c= 0;\n            pulse_fresh \u003c= 0;\n            pulse_hit \u003c= 0;\n            pulse_frame \u003c= 0;\n            soft_reset \u003c= 0;\n            fault_seen \u003c= 0;\n            txn_age_ms \u003c= 0;\n            protocol_errors \u003c= 0;\n            event_latch \u003c= 0;\n            rvalid \u003c= 0;\n            rdata \u003c= 0;\n            // 传输复位只终止半帧、清总线应答，不复位告警规则核；已接受业务计数/告警继续保留。\n        end else if (bus_reset) begin\n            fault_seen \u003c= fault;\n            txn_age_ms \u003c= 0;\n            // Abort transport/partial frame while retaining accepted business state.\n            pending \u003c= 0;\n            txn \u003c= 0;\n            bad \u003c= 0;\n            have_xy \u003c= 0;\n            shadow_frame \u003c= 0;\n            xy \u003c= 0;\n            boxes \u003c= 0;\n            hit \u003c= 0;\n            pulse \u003c= 0;\n            pulse_fresh \u003c= 0;\n            pulse_hit \u003c= 0;\n            pulse_frame \u003c= 0;\n            soft_reset \u003c= 0;\n            rvalid \u003c= 0;\n            rdata \u003c= 0;\n            event_latch \u003c= event_latch | {28'b0, events};\n        end else begin\n            fault_seen \u003c= fault;\n            if (!txn || abort_txn)\n                txn_age_ms \u003c= 0;\n            else if (tick_ms)\n                txn_age_ms \u003c= txn_age_ms + 1'b1;\n            // fault入口和已开事务超时都使旧事务失效，即使fault早已置位也不能无限保留半帧。\n            if (abort_txn) begin\n                txn \u003c= 0;\n                bad \u003c= 0;\n                have_xy \u003c= 0;\n                shadow_frame \u003c= 0;\n                xy \u003c= 0;\n                boxes \u003c= 0;\n                hit \u003c= 0;\n            end\n            pulse \u003c= 0;\n            pending \u003c= 0;\n            soft_reset \u003c= 0;\n            event_latch \u003c= event_latch | {28'b0, events};\n            if (rvalid && rready)\n                rvalid \u003c= 0;\n            if (arvalid && arready) begin\n                rvalid \u003c= 1;\n                // 0x20状态，0x24末帧，0x28接受，0x2C拒绝，0x30协议错，0x34事件，0xC0签名。\n                case (araddr[17 : 2])\n                    16'h0008:\n                        rdata \u003c= {19'b0, hit, empties, positives, 1'b0, have_frame, fault, alarm};\n                    16'h0009:\n                        rdata \u003c= last_frame;\n                    16'h000a:\n                        rdata \u003c= accepts;\n                    16'h000b:\n                        rdata \u003c= rejects;\n                    16'h000c:\n                        rdata \u003c= protocol_errors;\n                    16'h000d:\n                        rdata \u003c= event_latch;\n                    16'h0010:\n                        rdata \u003c= 32'h4F425331;\n                    16'h0011:\n                        rdata \u003c= 32'd100000000;\n                    16'h0012:\n                        rdata \u003c= obs_cycles[31 : 0];\n                    16'h0013:\n                        rdata \u003c= obs_cycles[63 : 32];\n                    16'h0014:\n                        rdata \u003c= obs_seq;\n                    16'h0015:\n                        rdata \u003c= {28'b0, obs_valid};\n                    16'h0016:\n                        rdata \u003c= {28'b0, obs_last_mask};\n                    16'h0018:\n                        rdata \u003c= obs_assert[31 : 0];\n                    16'h0019:\n                        rdata \u003c= obs_assert[63 : 32];\n                    16'h001a:\n                        rdata \u003c= obs_clear[31 : 0];\n                    16'h001b:\n                        rdata \u003c= obs_clear[63 : 32];\n                    16'h001c:\n                        rdata \u003c= obs_fault[31 : 0];\n                    16'h001d:\n                        rdata \u003c= obs_fault[63 : 32];\n                    16'h001e:\n                        rdata \u003c= obs_recover[31 : 0];\n                    16'h001f:\n                        rdata \u003c= obs_recover[63 : 32];\n                    16'h0020:\n                        rdata \u003c= obs_assert_frame;\n                    16'h0021:\n                        rdata \u003c= obs_clear_frame;\n                    16'h0022:\n                        rdata \u003c= obs_fault_frame;\n                    16'h0023:\n                        rdata \u003c= obs_recover_frame;\n\n                    16'h0030:\n                        rdata \u003c= 32'hA5050001;\n                    default:\n                        rdata \u003c= 32'hBAD04960;\n                endcase\n            end\n            if (awvalid && awready) begin\n                // 写寄存器：0x00受控业务复位，0x04 BEGIN，0x08/0x0C框，0x10 COMMIT，0x38事件W1C。\n                case (awaddr[17 : 2])\n                    16'h0000:\n                        if (awdata == 1)\n                            soft_reset \u003c= 1;\n                    // BEGIN重建影子事务；上一事务未完成时增加协议错，不假装其已经提交成功。\n                    16'h0001: begin\n                        if (txn)\n                            protocol_errors \u003c= protocol_errors + 1;\n                        txn_age_ms \u003c= 0;\n                        txn \u003c= 1;\n                        bad \u003c= 0;\n                        have_xy \u003c= 0;\n                        boxes \u003c= 0;\n                        hit \u003c= 0;\n                        shadow_frame \u003c= awdata;\n                    end\n                    // XY0与XY1必须成对顺序写入；重复XY0会标bad，后续COMMIT不能转成正常空帧。\n                    16'h0002: begin\n                        if (!txn || have_xy) begin\n                            bad \u003c= 1;\n                            protocol_errors \u003c= protocol_errors + 1;\n                        end\n                        xy \u003c= awdata;\n                        have_xy \u003c= 1;\n                    end\n                    // 每对合法框更新boxes并累积hit；最多16框，整个事务只要任一框中心命中ROI即可。\n                    16'h0003: begin\n                        if (!txn || !have_xy || boxes == 16 || !valid_box) begin\n                            bad \u003c= 1;\n                            protocol_errors \u003c= protocol_errors + 1;\n                        end else begin\n                            boxes \u003c= boxes + 1;\n                            hit \u003c= hit | roi_match;\n                        end\n                        have_xy \u003c= 0;\n                    end\n                    // COMMIT编码：[15:8]框数，[0]fresh；其余位必须0且不得缺少半对坐标。\n                    // COMMIT先终止事务并检查编码、框数和半对坐标；成功才产生下一拍pulse交给规则核。\n                    // 空框事务允许boxes=0，但必须有新BEGIN并fresh=1，不能用缺失输入伪装成空帧。\n                    16'h0004: begin\n                        txn \u003c= 0;\n                        have_xy \u003c= 0;\n                        pending \u003c= 1;\n                        if (!txn || bad || have_xy || awdata[15 : 8] != {3'b0, boxes} ||\n                            |awdata[31 : 16] || |awdata[7 : 1])\n                            protocol_errors \u003c= protocol_errors + 1;\n                        else begin\n                            pulse \u003c= 1;\n                            pulse_frame \u003c= shadow_frame;\n                            pulse_fresh \u003c= awdata[0];\n                            pulse_hit \u003c= hit;\n                        end\n                    end\n                    // 事件写1清除；同周期的新events再OR回来，避免清旧事件时丢失新事件。\n                    16'h000e:\n                        event_latch \u003c= (event_latch & ~awdata) | {28'b0, events};\n                    default:\n                        protocol_errors \u003c= protocol_errors + 1;\n                endcase\n            end\n        end\n    end\nendmodule\n", "sha256": "d38f1d0465ae129f44be88aa770138c210d585ef77ca764fe47d980f3e27e668", "functions": [{"name": "region_alarm_regs_m505", "line": 7, "end": 42}]}, {"group": "硬件告警", "path": "src/pl/alarm/region_alarm_core.v", "name": "region_alarm_core.v", "desc": "连续3次命中置警、8次无命中解除；断流时保留告警。", "content": "// 已上板业务状态机：有效新帧、ROI命中3次置位、无命中8次解除。\n// 计数的是有效推理观测，不是相机全部帧；3/8为经验防抖常数，属于当前演示配置。\n// 有效提交中断1000ms置fault并保留原alarm；新完整有效帧恢复fault。\n\n// Business logic: fresh ROI observations, 3 positive / 8 empty, stream fault.\nmodule region_alarm_core\n    #(parameter integer TIMEOUT_MS = 1000)\n    (input wire clk, reset, tick_ms, commit, fresh, region_hit,\n     input wire [31 : 0] frame_id,\n     output reg alarm, fault, have_frame,\n     output reg [3 : 0] positive_run, empty_run,\n     output reg [31 : 0] last_frame, accepted_count, rejected_count,\n     output reg [3 : 0] events);\n    // 接口中的commit为一拍脉冲，fresh由事务层提供；本核只接收完整结果的ROI布尔量。\n    // 输出events[0/1/2/3]依次为置警、解除、断流、恢复，一拍后由寄存器层锁存。\n    // alarm和fault是独立状态：故障不表示无目标，断流不能自动清除先前告警。\n    reg [15 : 0] age_ms;\n    // 32位序号以模差判断新旧；接受正向半区间，重复或倒退不参与计数。\n    wire [31 : 0] delta = frame_id - last_frame;\n    // 首帧可接受；后续delta需位于正向半个32位序号空间，重复或倒退只增加拒绝计数。\n    wire accept = commit && fresh && (!have_frame || (delta != 0 && !delta[31]));\n    // 跳号会打断连续性，避免未知/丢失观测被当作连续命中或连续空帧。\n    wire consecutive = have_frame && delta == 1;\n    always @(posedge clk) begin\n        if (reset) begin\n            alarm \u003c= 0;\n            fault \u003c= 0;\n            have_frame \u003c= 0;\n            positive_run \u003c= 0;\n            empty_run \u003c= 0;\n            last_frame \u003c= 0;\n            accepted_count \u003c= 0;\n            rejected_count \u003c= 0;\n            age_ms \u003c= 0;\n            events \u003c= 0;\n        end else begin\n            // 每个事件仅脉冲一拍；当周期没有新的业务事件就回到0，软件读取锁存寄存器。\n            events \u003c= 0;\n            if (commit && !accept)\n                rejected_count \u003c= rejected_count + 1;\n            // 有效新提交优先于同周期时基；接受帧后重新计断流年龄。\n            if (accept) begin\n                accepted_count \u003c= accepted_count + 1;\n                last_frame \u003c= frame_id;\n                have_frame \u003c= 1;\n                age_ms \u003c= 0;\n                if (fault)\n                    events[3] \u003c= 1;\n                fault \u003c= 0;\n                // 非阻塞赋值右侧是上一周期计数，因此positive_run>=2时，当前命中是连续第3次。\n                // 计数饱和于3/8，避免运行时间越长计数越大。\n                if (region_hit) begin\n                    empty_run \u003c= 0;\n                    positive_run \u003c=\n                        consecutive && positive_run \u003c 3 ? positive_run + 1 : (consecutive ? 3 : 1);\n                    if (consecutive && positive_run >= 2 && !alarm) begin\n                        alarm \u003c= 1;\n                        events[0] \u003c= 1;\n                    end\n                end else begin\n                    positive_run \u003c= 0;\n                    empty_run \u003c=\n                        consecutive && empty_run \u003c 8 ? empty_run + 1 : (consecutive ? 8 : 1);\n                    if (consecutive && empty_run >= 7 && alarm) begin\n                        alarm \u003c= 0;\n                        events[1] \u003c= 1;\n                    end\n                end\n                // fault与alarm分离：未观测不等于无目标，故障时保持上次告警。\n            // 1ms业务时基独立于CPU提交；超时入口清连续计数但保留alarm，下一有效帧清fault。\n            end else if (tick_ms && !fault) begin\n                if (age_ms == TIMEOUT_MS - 1) begin\n                    fault \u003c= 1;\n                    positive_run \u003c= 0;\n                    empty_run \u003c= 0;\n                    events[2] \u003c= 1;\n                    // Hold the last alarm during loss of observations; fault is separate.\n                end else\n                    age_ms \u003c= age_ms + 1;\n            end\n        end\n    end\nendmodule\n", "sha256": "cd4641d412a1b2367411eabc6aa60266b6d38e14d6edf4e114f47e60e552a6cc", "functions": [{"name": "region_alarm_core", "line": 6, "end": 41}]}, {"group": "硬件告警", "path": "src/pl/alarm/alarm_observer.v", "name": "alarm_observer.v", "desc": "记录置警、清警、断流和恢复的最近硬件周期。", "content": "// 四类事件各保存最近一次时间与帧号；bit0到3依次为置警、清警、断流、恢复。\n// Bounded read-only event history. No feedback into the alarm decision.\n// Clock is the existing 100MHz business clock. Counter epoch is business_reset,\n// not UTC, and is not reset by NPU/bus reset, event W1C or business soft-clear.\nmodule alarm_observer\n    (input wire clk, reset,\n     input wire [3 : 0] events,\n     input wire [31 : 0] event_frame,\n     output reg [63 : 0] cycles,\n     output reg [31 : 0] event_seq,\n     output reg [3 : 0] valid_mask, last_mask,\n     output reg [63 : 0] assert_cycles, clear_cycles, fault_cycles, recover_cycles,\n     output reg [31 : 0] assert_frame, clear_frame, fault_frame, recover_frame);\n    // Core events are registered on the same edge as the state transition.\n    // We observe them one edge later; subtract one to identify that transition's\n    // pre-edge cycle count. Publication is delayed one clock (10ns), while the\n    // recorded timestamp corresponds to the actual core state transition.\n    // 事件晚一个时钟送到这里，减1后对应状态实际变化的周期。\n    // 只读观察支路：没有反馈到alarm/fault；64位周期数以业务复位为起点。\n    // valid_mask区分尚未发生的事件，last_mask保留同周期可能同时出现的事件。\n    wire [63 : 0] event_cycles = cycles - 64'd1;\n    always @(posedge clk) begin\n        if (reset) begin\n            cycles \u003c= 0;\n            event_seq \u003c= 0;\n            valid_mask \u003c= 0;\n            last_mask \u003c= 0;\n            assert_cycles \u003c= 0;\n            clear_cycles \u003c= 0;\n            fault_cycles \u003c= 0;\n            recover_cycles \u003c= 0;\n            assert_frame \u003c= 0;\n            clear_frame \u003c= 0;\n            fault_frame \u003c= 0;\n            recover_frame \u003c= 0;\n        end else begin\n            cycles \u003c= cycles + 64'd1;\n            if (|events) begin\n                // One sequence increment per transition clock; recovery and\n                // alarm assertion may occur together and retain both records.\n                event_seq \u003c= event_seq + 32'd1;\n                valid_mask \u003c= valid_mask | events;\n                last_mask \u003c= events;\n                if (events[0]) begin\n                    assert_cycles \u003c= event_cycles;\n                    assert_frame \u003c= event_frame;\n                end\n                if (events[1]) begin\n                    clear_cycles \u003c= event_cycles;\n                    clear_frame \u003c= event_frame;\n                end\n                if (events[2]) begin\n                    fault_cycles \u003c= event_cycles;\n                    fault_frame \u003c= event_frame;\n                end\n                if (events[3]) begin\n                    recover_cycles \u003c= event_cycles;\n                    recover_frame \u003c= event_frame;\n                end\n            end\n        end\n    end\nendmodule\n", "sha256": "dbaded62921cd1339430dccef89199130d000a5d9099478d62b9a5a52ad5a6c4", "functions": [{"name": "alarm_observer", "line": 5, "end": 40}]}, {"group": "硬件告警", "path": "src/pl/alarm/alarm_tick_100m.v", "name": "alarm_tick_100m.v", "desc": "100MHz业务时钟产生1ms计时基准。", "content": "// 在实际100MHz gp_clk域产生1ms时基；计数分级以减小比较链。\n// 不是CPU定时器，因此无新提交时仍能置故障，前提是该时钟与供电仍在。\n\nmodule alarm_tick_100m\n    (input wire clk, reset,\n     output wire tick_ms);\n    // 两级计数及提前一拍比较形成100MHz→1ms脉冲。lo_last/hi_last是寄存器，\n    // 比较常量与非阻塞赋值配套，不能当成组合计数器直接改成999/99；周期由tb_autonomous_tick核对。\n    reg [9 : 0] lo = 0;\n    reg [6 : 0] hi = 0;\n    reg lo_last = 0, hi_last = 0;\n    assign tick_ms = lo_last && hi_last;\n    always @(posedge clk) begin\n        if (reset) begin\n            lo \u003c= 0;\n            hi \u003c= 0;\n            lo_last \u003c= 0;\n            hi_last \u003c= 0;\n        end else begin\n            lo_last \u003c= lo == 998;\n            lo \u003c= lo_last ? 0 : lo + 1'b1;\n            if (lo_last) begin\n                hi_last \u003c= hi == 98;\n                hi \u003c= hi_last ? 0 : hi + 1'b1;\n            end\n        end\n    end\nendmodule\n", "sha256": "0cb1da4ab7f5d109d4bf20bceb7886e57a73a5b2f99d0365947c998b8a4ef933", "functions": [{"name": "alarm_tick_100m", "line": 4, "end": 28}]}, {"group": "界面与查看", "path": "src/board/runtime/viewer.py", "name": "viewer.py", "desc": "只读发布画面、状态、告警记录与导出内容。", "content": "\"\"\"提供画面、状态、告警记录和导出的HTTP读取入口。\"\"\"\nfrom pathlib import Path\nimport argparse, json, mimetypes, threading, tempfile, zipfile, socket, shutil, time\nfrom http.server import ThreadingHTTPServer, BaseHTTPRequestHandler\nfrom service_state import ROOT, current, snapshot\n\nEXPORT = threading.Lock()\n\n\n# 最多8个并发HTTP连接，每连接10秒超时；它只承担查看，不承担认证控制。\nclass Server(ThreadingHTTPServer):\n    daemon_threads = True\n\n    # 建立连接配额，避免多浏览器刷新产生无界线程。\n    def __init__(self, *a):\n        self.slots = threading.BoundedSemaphore(8)\n        super().__init__(*a)\n\n    # 配额耗尽即关闭新连接；启动线程失败时归还配额。\n    def process_request(self, request, address):\n        if not self.slots.acquire(blocking=False):\n            request.close()\n            return\n        request.settimeout(10)\n        try:\n            super().process_request(request, address)\n        except Exception:\n            self.slots.release()\n            raise\n\n    # 无论响应成功或异常，在线程退出时归还连接配额。\n    def process_request_thread(self, *args):\n        try:\n            super().process_request_thread(*args)\n        finally:\n            self.slots.release()\n\n\nclass Handler(BaseHTTPRequestHandler):\n    # 发送长度明确且不缓存的响应；客户端断开不影响板端检测。\n    def output(self, data, mime=\"application/json\", status=200):\n        self.send_response(status)\n        self.send_header(\"Content-Type\", mime)\n        self.send_header(\"Content-Length\", str(len(data)))\n        self.send_header(\"Cache-Control\", \"no-store\")\n        self.end_headers()\n        try:\n            self.wfile.write(data)\n        except (OSError, TimeoutError):\n            pass\n\n    # GET白名单只读资源。没有LAN控制路由。\n    # 仅匹配固定资源白名单，不将URL拼接成任意文件路径，也没有start/stop路由。\n    def do_GET(self):\n        path = self.path.split(\"?\", 1)[0]\n        if path == \"/api/state\":\n            return self.output(json.dumps(snapshot(), ensure_ascii=False).encode())\n        active, out = current()\n        if path == \"/export.zip\" and out:\n            return self.export(out, active)\n        allowed = {\n            \"/preview.jpg\": \"latest.jpg\",\n            \"/events.csv\": \"events.csv\",\n            \"/result.json\": \"result.json\",\n            \"/resources.json\": \"resources.json\",\n        }\n        if path in allowed and out:\n            p = out / allowed[path]\n            if p.is_file():\n                return self.output(\n                    p.read_bytes(), mimetypes.guess_type(p.name)[0] or \"application/octet-stream\"\n                )\n        return self.output(b\"Not available\", \"text/plain\", 404)\n\n    # 串行导出近期轮转记录，超过1MiB后落临时文件，避免全ZIP驻留内存。\n    # 导出当前滚动记录，串行构建ZIP；超过1MiB后由临时文件承接。\n    # 运行中导出可能跨帧或日志轮转，只代表近期记录，不是完整不可变评测快照。\n    def export(self, out, active):\n        if not EXPORT.acquire(blocking=False):\n            return self.output(b\"Export busy\", \"text/plain\", 429)\n        try:\n            with tempfile.SpooledTemporaryFile(max_size=1024 * 1024) as data:\n                with zipfile.ZipFile(data, \"w\", zipfile.ZIP_DEFLATED, compresslevel=1) as z:\n                    z.writestr(\n                        \"EXPORT_INFO.json\",\n                        json.dumps(\n                            dict(\n                                active=active,\n                                snapshot=snapshot(),\n                                note=\"Recent rolling records only; live export may straddle a frame/rotation. Not an independent accuracy evaluation.\",\n                            ),\n                            ensure_ascii=False,\n                        ),\n                    )\n                    for p in sorted(out.iterdir()):\n                        if p.is_file() and p.name != \"STOP\" and not p.name.endswith(\".tmp\"):\n                            try:\n                                z.write(p, p.name)\n                            except FileNotFoundError:\n                                pass\n                size = data.tell()\n                data.seek(0)\n                self.send_response(200)\n                self.send_header(\"Content-Type\", \"application/zip\")\n                self.send_header(\n                    \"Content-Disposition\",\n                    'attachment; filename=\"model11_' + active[\"session\"] + '.zip\"',\n                )\n                self.send_header(\"Content-Length\", str(size))\n                self.send_header(\"Cache-Control\", \"no-store\")\n                self.end_headers()\n                shutil.copyfileobj(data, self.wfile, 64 * 1024)\n        except (OSError, TimeoutError):\n            pass\n        finally:\n            EXPORT.release()\n\n    # 关闭HTTP逐请求打印，避免轮询持续制造访问日志。\n    def log_message(self, *args):\n        pass\n\n\nif __name__ == \"__main__\":\n    a = argparse.ArgumentParser()\n    a.add_argument(\"--bind\", default=\"0.0.0.0\")\n    a.add_argument(\"--port\", type=int, default=8080)\n    v = a.parse_args()\n    Server((v.bind, v.port), Handler).serve_forever()\n", "sha256": "0772960deff0f04ff88554909766cbc7048300cf73fabdcc0d2d1957f1bb5e63", "functions": [{"name": "Server.__init__", "line": 15, "end": 17}, {"name": "Server.process_request", "line": 20, "end": 29}, {"name": "Server.process_request_thread", "line": 32, "end": 36}, {"name": "Handler.output", "line": 41, "end": 50}, {"name": "Handler.do_GET", "line": 54, "end": 73}, {"name": "Handler.export", "line": 78, "end": 116}, {"name": "Handler.log_message", "line": 119, "end": 120}]}, {"group": "界面与查看", "path": "src/board/runtime/service_state.py", "name": "service_state.py", "desc": "汇总启动、检测和停止阶段的实时状态。", "content": "\"\"\"汇总当前启动、检测会话和运行状态。\"\"\"\nfrom pathlib import Path\nimport json, time\n\nROOT = Path(__file__).resolve().parent\n\n\n# 仅用于展示文件，读取失败返回空状态；硬件运行阶段仍由snapshot明确判定。\ndef read(p):\n    try:\n        return json.loads(p.read_text())\n    except (OSError, ValueError):\n        return {}\n\n\n# 只接受camera_会话名，避免把任意路径用作导出根目录。\n# 会话名只允许camera_前缀和字母数字下划线；返回活动记录及受限会话路径。\ndef current():\n    x = read(ROOT / \"ACTIVE_RUN.json\")\n    name = x.get(\"session\", \"\")\n    if not name.startswith(\"camera_\") or not all(c.isalnum() or c == \"_\" for c in name):\n        return {}, None\n    return x, ROOT / \"sessions\" / name\n\n\n# 汇合服务阶段与会话状态后，再检查boot和更新时间。历史JPEG可以继续展示，\n# 但只有同boot、RUNNING且3秒内更新的状态标为live，避免把停止画面当实时结果。\ndef snapshot():\n    boot = Path(\"/proc/sys/kernel/random/boot_id\").read_text().strip()\n    now = time.monotonic()\n    active, out = current()\n    app = read(ROOT / \"APP_STATE.json\")\n    state = read(out / \"state.json\") if out else {}\n    age = max(0, now - state.get(\"updated_monotonic_s\", 0)) if state.get(\"boot\") == boot else None\n    phase = state.get(\"phase\", \"IDLE\")\n    if app.get(\"boot\") != boot:\n        phase = \"NOT_STARTED_THIS_BOOT\"\n    elif app.get(\"phase\") != \"ACTIVE\":\n        phase = app.get(\"phase\", \"IDLE\")\n    elif active.get(\"boot\") != boot or state.get(\"boot\") != boot:\n        phase = \"STARTING\"\n    if (ROOT / \"UNKNOWN.json\").exists():\n        phase = \"UNKNOWN_RETAINED\"\n    live = phase == \"RUNNING\" and age is not None and age \u003c 3\n    if phase == \"RUNNING\" and not live:\n        phase = \"STALE_INPUT\"\n    result = dict(\n        model=\"11\",\n        boot=boot,\n        board_uptime_s=now,\n        active=active,\n        app=app,\n        state=state,\n        phase=phase,\n        live=live,\n        state_age_s=age,\n        history_only=not live,\n        record_retention=\"Rolling recent records; up to five completed/current sessions. Export before overwrite.\",\n    )\n    if out and (out / \"latest.jpg\").is_file():\n        result[\"preview_available\"] = True\n    return result\n", "sha256": "6b93691942f39d2f3ee9d6364e38f8c9ed2bc108a74353ee26a4f6b628fbc43a", "functions": [{"name": "read", "line": 9, "end": 13}, {"name": "current", "line": 18, "end": 23}, {"name": "snapshot", "line": 28, "end": 62}]}, {"group": "界面与查看", "path": "src/desktop/Desktop.cs", "name": "Desktop.cs", "desc": "Windows画面、运行状态、告警记录与操作界面。", "content": "// 原生WinForms界面。HTTP只读画面/状态/导出，启停通过认证SSH组件完成。\n// 用户配置位于LocalAppData，程序目录不携带私钥。\n\nusing System;\nusing System.Collections.Generic;\nusing System.Diagnostics;\nusing System.Drawing;\nusing System.Drawing.Drawing2D;\nusing System.IO;\nusing System.Net;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Web.Script.Serialization;\nusing System.Windows.Forms;\nusing System.Reflection;\n[assembly:AssemblyTitle(\"无人机检测系统\")]\n[assembly:AssemblyDescription(\"模型11 · FPGA板端检测与告警桌面客户端\")]\n[assembly:AssemblyCompany(\"\")]\n[assembly:AssemblyVersion(\"2.5.0.0\")]\nnamespace UAVDetectionSystem {\n// JSON字段类型转换集中在此。\n// 显示层统一处理JSON的缺字段和数值转换；网络错误与板端故障状态仍由调用方分别显示。\nstatic class J {\n    public static Dictionary\u003cstring, object> D(object x) {\n        return x as Dictionary\u003cstring, object> ?? new Dictionary\u003cstring, object>();\n    }\n    public static object G(object x, string k) {\n        object v;\n        return D(x).TryGetValue(k, out v) ? v : null;\n    }\n    public static string S(object x) { return x == null ? \"\" : Convert.ToString(x); }\n    public static long N(object x) { return x == null ? 0 : Convert.ToInt64(x); }\n    public static double F(object x) { return x == null ? 0 : Convert.ToDouble(x); }\n    public static bool B(object x) { return x != null && Convert.ToBoolean(x); }\n    public static string Encode(object x) { return new JavaScriptSerializer().Serialize(x); }\n    // 限制单次JSON大小为1MiB，避免把无限响应作为状态对象加载。\n    public static Dictionary\u003cstring, object> Decode(string x) {\n        return new JavaScriptSerializer() { MaxJsonLength = 1024 * 1024 }\n            .Deserialize\u003cDictionary\u003cstring, object>>(x);\n    }\n}\nstatic class Theme {\n    public static Color Bg = Color.FromArgb(243, 246, 251), Ink = Color.FromArgb(25, 41, 65),\n                        Muted = Color.FromArgb(116, 132, 154), Blue = Color.FromArgb(49, 103, 235),\n                        Green = Color.FromArgb(21, 151, 114), Red = Color.FromArgb(210, 65, 77),\n                        Line = Color.FromArgb(228, 234, 243), Navy = Color.FromArgb(18, 32, 54);\n    public static Font Font(float size = 10, FontStyle style = FontStyle.Regular) {\n        return new Font(\"Microsoft YaHei UI\", size, style, GraphicsUnit.Point);\n    }\n    public static GraphicsPath Round(Rectangle r, int n) {\n        var p = new GraphicsPath();\n        int d = n * 2;\n        p.AddArc(r.X, r.Y, d, d, 180, 90);\n        p.AddArc(r.Right - d, r.Y, d, d, 270, 90);\n        p.AddArc(r.Right - d, r.Bottom - d, d, d, 0, 90);\n        p.AddArc(r.X, r.Bottom - d, d, d, 90, 90);\n        p.CloseFigure();\n        return p;\n    }\n    public static Label Label(string text, float size, Color color,\n                              FontStyle style = FontStyle.Regular) {\n        return new Label() { Text = text, Font = Font(size, style), ForeColor = color,\n                             AutoSize = false, BackColor = Color.Transparent };\n    }\n}\nclass Card : Panel {\n    public Card() {\n        DoubleBuffered = true;\n        BackColor = Color.White;\n        Padding = new Padding(18);\n    }\n    protected override void OnPaint(PaintEventArgs e) {\n        base.OnPaint(e);\n        e.Graphics.SmoothingMode = SmoothingMode.AntiAlias;\n        using (var path = Theme.Round(new Rectangle(0, 0, Width - 1, Height - 1), 12)) using (\n            var pen = new Pen(Theme.Line)) e.Graphics.DrawPath(pen, path);\n    }\n}\n// 按钮维护hover/pressed/键盘焦点外观，鼠标捕获丢失会清pressed，避免按钮看起来一直按下。\nclass ActionButton : Button {\n    public Color Fill = Color.White, Ink = Theme.Ink, Border = Theme.Line;\n    public bool ActiveNavigation;\n    bool hover, pressed;\n    public ActionButton() {\n        FlatStyle = FlatStyle.Flat;\n        FlatAppearance.BorderSize = 0;\n        Font = Theme.Font(10, FontStyle.Bold);\n        Cursor = Cursors.Hand;\n        Height = 42;\n        TabStop = true;\n        UseVisualStyleBackColor = false;\n        DoubleBuffered = true;\n        ResizeRedraw = true;\n    }\n    protected override void OnMouseEnter(EventArgs e) {\n        hover = true;\n        Invalidate();\n        base.OnMouseEnter(e);\n    }\n    protected override void OnMouseLeave(EventArgs e) {\n        hover = false;\n        pressed = false;\n        Invalidate();\n        base.OnMouseLeave(e);\n    }\n    protected override void OnMouseDown(MouseEventArgs e) {\n        if (e.Button == MouseButtons.Left) { pressed = true; Invalidate(); }\n        base.OnMouseDown(e);\n    }\n    protected override void OnMouseUp(MouseEventArgs e) {\n        pressed = false; Invalidate(); base.OnMouseUp(e);\n    }\n    protected override void OnMouseCaptureChanged(EventArgs e) {\n        if (!Capture) { pressed = false; Invalidate(); }\n        base.OnMouseCaptureChanged(e);\n    }\n    protected override void OnPaint(PaintEventArgs e) {\n        e.Graphics.SmoothingMode = SmoothingMode.AntiAlias;\n        bool dark = Fill.GetBrightness() \u003c .38F;\n        Color fill = !Enabled ? Color.FromArgb(232, 237, 244) :\n            (pressed ? (dark ? ControlPaint.Light(Fill, .30F) : Color.FromArgb(218, 229, 252)) :\n            (hover ? (dark ? ControlPaint.Light(Fill, .20F) : Color.FromArgb(237, 243, 255)) : Fill));\n        if (Fill == Theme.Blue && Enabled) fill = pressed ? Color.FromArgb(32, 79, 200) :\n            (hover ? Color.FromArgb(70, 124, 249) : Fill);\n        Color outline = Enabled && hover && !dark && Fill != Theme.Blue ? Theme.Blue : Border;\n        using (var p = Theme.Round(new Rectangle(1, 1, Width - 3, Height - 3), 8)) using (\n            var b = new SolidBrush(fill)) using (var pen = new Pen(outline)) {\n            e.Graphics.FillPath(b, p);\n            e.Graphics.DrawPath(pen, p);\n        }\n        if (ActiveNavigation && Enabled) {\n            using (var b = new SolidBrush(Color.FromArgb(116, 166, 255)))\n                e.Graphics.FillRectangle(b, 2, 10, 3, Height - 20);\n        }\n        TextRenderer.DrawText(e.Graphics, Text, Font, ClientRectangle, Enabled ? Ink : Theme.Muted,\n                              TextFormatFlags.HorizontalCenter | TextFormatFlags.VerticalCenter);\n        if (Focused)\n            ControlPaint.DrawFocusRectangle(e.Graphics,\n                                            new Rectangle(5, 5, Width - 10, Height - 10));\n    }\n}\n// 原生绘图按比例显示，换帧和释放时Dispose位图。\n// 只在UI线程替换当前位图；等比例绘制，旧图和销毁控件时释放GDI对象。\nclass VideoSurface : Control {\n    Image frame;\n    public bool Live;\n    public bool DisplayPaused, PreviewStale;\n    public string Message = \"正在连接板端…\";\n    public VideoSurface() {\n        DoubleBuffered = true;\n        BackColor = Color.FromArgb(9, 17, 29);\n        AccessibleName = \"相机实时画面\";\n    }\n    // 从内存流解码后复制成独立Bitmap，离开using仍可显示；替换后Dispose旧帧。\n    public void SetFrame(byte[] bytes) {\n        using (var stream = new MemoryStream(bytes)) using (var original =\n                                                                Image.FromStream(stream)) {\n            var next = new Bitmap(original);\n            var old = frame;\n            frame = next;\n            if (old != null)\n                old.Dispose();\n        }\n        Invalidate();\n    }\n    protected override void OnPaint(PaintEventArgs e) {\n        base.OnPaint(e);\n        var g = e.Graphics;\n        g.Clear(BackColor);\n        if (frame != null) {\n            double scale = Math.Min((double)Width / frame.Width, (double)Height / frame.Height);\n            int w = (int)(frame.Width * scale), h = (int)(frame.Height * scale);\n            g.InterpolationMode = InterpolationMode.HighQualityBicubic;\n            g.DrawImage(frame, (Width - w) / 2, (Height - h) / 2, w, h);\n        } else {\n            using (var pen = new Pen(Color.FromArgb(29, 45, 65))) for (int x = 0; x \u003c Width;\n                                                                       x += 40)\n                g.DrawLine(pen, x, 0, x, Height);\n        }\n        if (DisplayPaused && frame != null) {\n            using (var b = new SolidBrush(Color.FromArgb(215, 18, 32, 54)))\n                g.FillRectangle(b, 0, 0, Width, 43);\n            using (var font = Theme.Font(10, FontStyle.Bold))\n                TextRenderer.DrawText(g, \"画面已暂停 · 仅暂停本机显示\", font,\n                    new Rectangle(14, 0, Math.Max(10, Width - 28), 43), Color.White,\n                    TextFormatFlags.Left | TextFormatFlags.VerticalCenter);\n        } else if (!Live || PreviewStale) {\n            using (var b = new SolidBrush(Color.FromArgb(155, 9, 17, 29)))\n                g.FillRectangle(b, ClientRectangle);\n            string message = PreviewStale && Live ? \"画面暂未更新\\n正在等待新画面\" : Message;\n            using (var font = Theme.Font(15, FontStyle.Bold))\n            TextRenderer.DrawText(g, message, font,\n                                  new Rectangle(20, Height / 2 - 40, Math.Max(10, Width - 40), 80),\n                                  Color.White,\n                                  TextFormatFlags.HorizontalCenter |\n                                      TextFormatFlags.VerticalCenter | TextFormatFlags.WordBreak);\n        }\n    }\n    protected override void Dispose(bool disposing) {\n        if (disposing && frame != null)\n            frame.Dispose();\n        base.Dispose(disposing);\n    }\n}\n// 网络边界：HTTP只读，控制走SSH子进程。\n// HTTP只读状态/画面/导出，写操作调用独立SSH组件；客户端不加载模型、SDK或寄存器映射。\nstatic class Api {\n    public static string Root = AppDomain.CurrentDomain.BaseDirectory, Data, ConfigPath;\n    public static Dictionary\u003cstring, object> Config;\n    // 默认只绑定既有板卡地址/端口/指纹；私钥路径不随迁移包内置。\n    public static Dictionary\u003cstring, object> Defaults() {\n        return new Dictionary\u003cstring, object> {\n            { \"host\", \"169.254.74.247\" },\n            { \"http_port\", 8080 },\n            { \"ssh_port\", 22 },\n            { \"username\", \"root\" },\n            { \"bind_address\", \"\" },\n            { \"key_file\", \"\" },\n            { \"host_fingerprint\", \"\" }\n        };\n    }\n    // 连接配置保存于当前Windows用户LocalAppData，可移动程序目录而不把账号配置发给他人。\n    public static void Initialize(string data) {\n        Data = data;\n        Directory.CreateDirectory(Data);\n        ConfigPath = Path.Combine(Data, \"connection.json\");\n        Config = Defaults();\n        if (File.Exists(ConfigPath)) {\n            foreach (var kv in J.Decode(File.ReadAllText(ConfigPath, Encoding.UTF8)))\n                Config[kv.Key] = kv.Value;\n        }\n    }\n    public static string Base(Dictionary\u003cstring, object> c) {\n        return new UriBuilder(\"http\", J.S(J.G(c, \"host\")), (int)J.N(J.G(c, \"http_port\")))\n            .Uri.ToString()\n            .TrimEnd('/');\n    }\n    // 后台线程发有超时和字节上限的HTTP GET；该函数本身不更新WinForms控件。\n    public static byte[] Read(string path, int limit = 1024 * 1024) {\n        var cfg = Config;\n        var req = (HttpWebRequest)WebRequest.Create(Base(cfg) + path);\n        req.Proxy = null;\n        req.Timeout = 2000;\n        req.ReadWriteTimeout = 2000;\n        using (var response = req.GetResponse()) using (\n            var stream = response.GetResponseStream()) using (var memory = new MemoryStream()) {\n            byte[] b = new byte[32768];\n            int n;\n            while ((n = stream.Read(b, 0, b.Length)) > 0) {\n                if (memory.Length + n > limit)\n                    throw new Exception(\"响应超出显示上限\");\n                memory.Write(b, 0, n);\n            }\n            return memory.ToArray();\n        }\n    }\n    public static Dictionary\u003cstring, object> State() {\n        return J.Decode(Encoding.UTF8.GetString(Read(\"/api/state\")));\n    }\n    // 只写本机连接配置，不修改网卡IP或板端网络；私钥只保存文件路径。\n    public static void Save(Dictionary\u003cstring, object> c) {\n        var host = J.S(J.G(c, \"host\"));\n        IPAddress ip;\n        if (!IPAddress.TryParse(host, out ip))\n            throw new Exception(\"请输入板卡IPv4地址\");\n        foreach (var k in new[] { \"http_port\", \"ssh_port\" })\n            if (J.N(J.G(c, k)) \u003c 1 || J.N(J.G(c, k)) > 65535)\n                throw new Exception(\"端口应在1到65535之间\");\n        string key = J.S(J.G(c, \"key_file\"));\n        if (key.Length > 0 && !File.Exists(key))\n            throw new Exception(\"所选密钥文件不存在\");\n        File.WriteAllText(ConfigPath, J.Encode(c), new UTF8Encoding(false));\n        Config = c;\n    }\n    public static string Quote(string s) { return \"\\\"\" + s.Replace(\"\\\"\", \"\\\\\\\"\") + \"\\\"\"; }\n    // 启动打包内的认证组件，并同时排空stdout/stderr；不依赖新电脑安装系统SSH。\n    // 等待超时不表示板端已停止，也不强杀板端进程；上层继续以实际状态为准。\n    public static Dictionary\u003cstring, object> Control(string action) {\n        if (!File.Exists(ConfigPath))\n            Save(Config);\n        string exe = Path.Combine(Root, @\"engine\\UAVControlAgent.exe\");\n        if (!File.Exists(exe))\n            throw new Exception(\"内置认证组件缺失，请完整解压软件文件夹，不要单独移动EXE。\");\n        var info = new ProcessStartInfo(exe, action + \" --config \" + Quote(ConfigPath)) {\n            UseShellExecute = false,\n            CreateNoWindow = true,\n            WindowStyle = ProcessWindowStyle.Hidden,\n            WorkingDirectory = Root,\n            RedirectStandardOutput = true,\n            RedirectStandardError = true,\n            StandardOutputEncoding = Encoding.UTF8,\n            StandardErrorEncoding = Encoding.UTF8\n        };\n        using (var process = Process.Start(info)) {\n            var read = process.StandardOutput.ReadToEndAsync();\n            var err = process.StandardError.ReadToEndAsync();\n            if (!process.WaitForExit(26000))\n                throw new Exception(\"认证控制响应超时，未终止板端进程，请查看运行状态。\");\n            string text = read.Result.Trim();\n            if (text.Length == 0)\n                throw new Exception(\"认证组件未返回结果：\" + err.Result);\n            var result = J.Decode(text);\n            if (!J.B(J.G(result, \"ok\")))\n                throw new Exception(J.S(J.G(result, \"error\")));\n            return result;\n        }\n    }\n    // 先写本地.partial文件，完整接收成功后再替换目标ZIP，避免把半个导出误当完整记录。\n    public static void Export(string path) {\n        var req = (HttpWebRequest)WebRequest.Create(Base(Config) + \"/export.zip\");\n        req.Proxy = null;\n        req.Timeout = 15000;\n        req.ReadWriteTimeout = 15000;\n        string partial = path + \".partial\";\n        using (var response = req.GetResponse()) using (\n            var stream =\n                response.GetResponseStream()) using (var f = new FileStream(partial,\n                                                                            FileMode.CreateNew)) {\n            byte[] b = new byte[65536];\n            int n;\n            while ((n = stream.Read(b, 0, b.Length)) > 0)\n                f.Write(b, 0, n);\n        }\n        if (File.Exists(path))\n            File.Replace(partial, path, null);\n        else\n            File.Move(partial, path);\n    }\n}\n// 本机连接设置；迁移后重新选择授权密钥和核实指纹。\nclass Settings : Form {\n    Dictionary\u003cstring, TextBox> fields = new Dictionary\u003cstring, TextBox>();\n    // 读取地址、端口、密钥路径和板卡主机指纹。\n    public Settings() {\n        Text = \"连接设置\";\n        Size = new Size(740, 515);\n        MinimumSize = Size;\n        StartPosition = FormStartPosition.CenterParent;\n        Font = Theme.Font();\n        BackColor = Theme.Bg;\n        var table = new TableLayoutPanel() { Dock = DockStyle.Fill, Padding = new Padding(24),\n                                             ColumnCount = 3, RowCount = 10 };\n        table.ColumnStyles.Add(new ColumnStyle(SizeType.Absolute, 135));\n        table.ColumnStyles.Add(new ColumnStyle(SizeType.Percent, 100));\n        table.ColumnStyles.Add(new ColumnStyle(SizeType.Absolute, 80));\n        Controls.Add(table);\n        string[] keys = { \"host\",         \"http_port\", \"ssh_port\",        \"username\",\n                          \"bind_address\", \"key_file\",  \"host_fingerprint\" };\n        string[] names = {\n            \"板卡地址\",      \"查看端口\",          \"SSH端口\", \"SSH用户名\", \"本机网口地址（可空）\",\n            \"已授权SSH私钥\", \"板卡主机SHA256指纹\"\n        };\n        for (int i = 0; i \u003c keys.Length; i++) {\n            table.RowStyles.Add(new RowStyle(SizeType.Absolute, 39));\n            table. ogResult = DialogResult.OK;\n                Close();\n            } catch (Exception ex) {\n                MessageBox.Show(this, ex.Message, \"设置未保存\", MessageBoxButtons.OK,\n                                MessageBoxIcon.Information);\n            }\n        };\n    }\n}\nclass MainForm : Form {\n    Panel workspace, monitor, records;\n    VideoSurface video;\n    Label connection, phase, reason, frames, fps, alarm, fault, duration, commits, age, notice,\n        address, recordInfo;\n    DataGridView eventGrid;\n    ActionButton start, stop, export, pausePreview, savePreview;\n    ActionButton navMonitor, navRecords;\n    System.Windows.Forms.Timer timer, previewTimer;\n    bool polling, commanding, closing, previewPolling, previewAvailable, previewRequested, viewPaused;\n    byte[] lastPreview;\n    string previewSession = \"\";\n    Label displayRate;\n    Stopwatch displayClock = Stopwatch.StartNew();\n    Stopwatch previewFreshness = Stopwatch.StartNew();\n    int displayed;\n    Dictionary\u003cstring, object> snapshot;\n    // 建立导航、状态和画面区；状态与预览使用独立定时器，各自限制一个在途请求。\n    // 关闭窗口只退出本机查看，板端自启检测继续运行。\n    public MainForm() {\n        Text = \"无人机检测系统\";\n        Size = new Size(1400, 900);\n        MinimumSize = new Size(1160, 760);\n        StartPosition = FormStartPosition.CenterScreen;\n        Font = Theme.Font();\n        BackColor = Theme.Bg;\n        DoubleBuffered = true;\n        KeyPreview = true;\n        Build();\n        KeyDown += async delegate(object sender, KeyEventArgs e) {\n            if (e.KeyCode == Keys.Space && !e.Control && monitor.Visible && !(ActiveControl is ButtonBase)) {\n                TogglePreview(); e.Handled = e.SuppressKeyPress = true;\n            } else if (e.Control && e.KeyCode == Keys.S && monitor.Visible) {\n                SavePreview(); e.Handled = e.SuppressKeyPress = true;\n            } else if (e.KeyCode == Keys.F5) {\n                await Poll(); if (records.Visible) await LoadEvents();\n                e.Handle
